            // Todo se filtra también por courseId (no solo professorId): cada
            // curso tiene su propia Expedición, con sus propios equipos —
            // nunca se mezclan estudiantes de un curso con los de otro.
            React.useEffect(() => {
                if (role !== 'professor') return;

                loadRosterForThisCourse();

                const unsubTeams = db.collection('artifacts/academic-platform/teams')
                    .where('professorId', '==', currentUser.uid)
                    .where('courseId', '==', courseId)
                    .onSnapshot(snap => {
                        setProfTeams(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        setLoading(false);
                    }, error => {
                        console.error('Error escuchando equipos:', error);
                        setLoading(false);
                    });

                const unsubAnn = db.collection('artifacts/academic-platform/announcements')
                    .where('professorId', '==', currentUser.uid)
                    .where('courseId', '==', courseId)
                    .onSnapshot(snap => {
                        setAnnouncements(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')));
                    }, error => console.error('Error escuchando anuncios:', error));

                return () => { unsubTeams(); unsubAnn(); };
            }, [role, courseId]);

            React.useEffect(() => {
                if (role !== 'professor' || profTeams.length === 0) return;
                const unsubs = profTeams.map(team =>
                    db.doc(`artifacts/academic-platform/progress/${team.id}`).onSnapshot(snap => {
                        setProfProgressByTeam(prev => ({ ...prev, [team.id]: snap.exists ? snap.data() : {} }));
                    }, error => console.error('Error escuchando progreso:', error))
                );
                return () => unsubs.forEach(u => u());
            }, [role, profTeams.map(t => t.id).join(',')]);

            const loadRosterForThisCourse = async () => {
                try {
                    const snap = await db.collection(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${courseId}/students`).get();
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setRosterStudents(list);
                    setKnownStudents(prev => {
                        const next = { ...prev };
                        list.forEach(s => { next[s.id] = { fullName: s.fullName, email: s.email }; });
                        return next;
                    });
                } catch (error) {
                    console.error('Error cargando roster:', error);
                    toast.showToast('Error cargando el roster del curso', 'error');
                }
            };

            const createTeam = async () => {
                const name = newTeamName.trim();
                if (!name) { toast.showToast('Ingresa un nombre de equipo', 'error'); return; }
                try {
                    await db.collection('artifacts/academic-platform/teams').add({
                        name, memberUids: [], professorId: currentUser.uid, courseId, createdAt: new Date()
                    });
                    setNewTeamName('');
                    toast.showToast('Equipo creado', 'success');
                } catch (error) {
                    console.error('Error creando equipo:', error);
                    toast.showToast('Error creando equipo', 'error');
                }
            };

            const addMemberUid = async (teamId, uid) => {
                const team = profTeams.find(t => t.id === teamId);
                if (team && (team.memberUids || []).includes(uid)) {
                    toast.showToast('Ese estudiante ya está en el equipo', 'info');
                    return;
                }
                // Un estudiante solo puede pertenecer a un equipo de la Expedición
                // a la vez — se revisa aquí también porque "+ Por correo" no pasa
                // por el filtro del selector "+ Agregar del roster".
                const otherTeam = profTeams.find(t => t.id !== teamId && (t.memberUids || []).includes(uid));
                if (otherTeam) {
                    toast.showToast(`Ese estudiante ya está en el equipo "${otherTeam.name}"`, 'error');
                    return;
                }
                try {
                    await db.doc(`artifacts/academic-platform/teams/${teamId}`).update({
                        memberUids: firebase.firestore.FieldValue.arrayUnion(uid)
                    });
                    toast.showToast('Integrante agregado', 'success');
                } catch (error) {
                    console.error('Error agregando integrante:', error);
                    toast.showToast('Error agregando integrante', 'error');
                }
            };

            const addMemberByEmail = async (teamId) => {
                const email = (emailToAdd[teamId] || '').trim().toLowerCase();
                if (!email) { toast.showToast('Ingresa un correo', 'error'); return; }
                try {
                    // Solo se busca en el roster de ESTE curso — un estudiante de
                    // otro curso del profesor no debe poder colarse en esta Expedición.
                    const snap = await db.collection(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${courseId}/students`)
                        .where('email', '==', email).get();
                    if (snap.empty) {
                        toast.showToast('No encontramos ese correo en el roster de este curso', 'error');
                        return;
                    }
                    const found = { id: snap.docs[0].id, ...snap.docs[0].data() };
                    setKnownStudents(prev => ({ ...prev, [found.id]: { fullName: found.fullName, email: found.email } }));
                    await addMemberUid(teamId, found.id);
                    setEmailToAdd(prev => ({ ...prev, [teamId]: '' }));
                } catch (error) {
                    console.error('Error buscando el correo:', error);
                    toast.showToast('Error buscando el correo', 'error');
                }
            };

            const removeMember = async (teamId, uid) => {
                try {
                    await db.doc(`artifacts/academic-platform/teams/${teamId}`).update({
                        memberUids: firebase.firestore.FieldValue.arrayRemove(uid)
                    });
                } catch (error) {
                    console.error('Error quitando integrante:', error);
                    toast.showToast('Error quitando integrante', 'error');
                }
            };

            const deleteTeam = async (teamId) => {
                if (!confirm('¿Borrar este equipo y su progreso? No se puede deshacer.')) return;
                try {
                    await db.doc(`artifacts/academic-platform/teams/${teamId}`).delete();
                    await db.doc(`artifacts/academic-platform/progress/${teamId}`).delete();
                    toast.showToast('Equipo eliminado', 'success');
                } catch (error) {
                    console.error('Error borrando equipo:', error);
                    toast.showToast('Error borrando equipo', 'error');
                }
            };

            const renameTeam = async (teamId, name) => {
                const trimmed = name.trim();
                if (!trimmed) { toast.showToast('Ingresa un nombre de equipo', 'error'); return; }
                try {
                    await db.doc(`artifacts/academic-platform/teams/${teamId}`).update({ name: trimmed });
                    setEditingTeamId(null);
                    toast.showToast('Nombre actualizado', 'success');
                } catch (error) {
                    console.error('Error renombrando equipo:', error);
                    toast.showToast('Error renombrando equipo', 'error');
                }
            };

            const gradeSubmission = async (teamId, wk) => {
                const key = `${teamId}-${wk}`;
                let crystals = parseInt(reviewInputs[key], 10);
                if (isNaN(crystals)) { toast.showToast('Selecciona una cantidad de cristales', 'error'); return; }
                crystals = Math.max(0, Math.min(EXPEDITION_MAX_PER_MISSION, Math.round(crystals / 10) * 10));
                const feedback = (reviewFeedback[key] || '').trim();
                try {
                    await db.doc(`artifacts/academic-platform/progress/${teamId}`).update({
                        [`${wk}.status`]: 'done',
                        [`${wk}.crystals`]: crystals,
                        [`${wk}.feedback`]: feedback
                    });
                    toast.showToast('Entrega calificada', 'success');
                } catch (error) {
                    console.error('Error calificando entrega:', error);
                    toast.showToast('Error calificando entrega', 'error');
                }
            };

            const publishAnnouncement = async () => {
                const text = announcementText.trim();
                if (!text) { toast.showToast('Escribe un texto para el anuncio', 'error'); return; }
                try {
                    await db.collection('artifacts/academic-platform/announcements').add({
                        text, date: new Date().toISOString(), professorId: currentUser.uid, courseId
                    });
                    setAnnouncementText('');
                    toast.showToast('Anuncio publicado', 'success');
                } catch (error) {
                    console.error('Error publicando anuncio:', error);
                    toast.showToast('Error publicando anuncio', 'error');
                }
            };

            // ===== Carga y listeners: ESTUDIANTE =====
            // Filtrado también por courseId: un estudiante puede estar en varios
            // cursos con Expedición habilitada a la vez, cada uno con su propio
            // equipo — sin esto podría mezclarse (o traer al azar) el equipo de
            // un curso distinto al que tiene seleccionado.
            React.useEffect(() => {
                if (role !== 'student') return;

                const unsubTeam = db.collection('artifacts/academic-platform/teams')
                    .where('memberUids', 'array-contains', currentUser.uid)
                    .where('courseId', '==', courseId)
                    .onSnapshot(snap => {
                        if (snap.empty) {
                            setMyTeam(null);
                            setLoading(false);
                            return;
                        }
                        setMyTeam({ id: snap.docs[0].id, ...snap.docs[0].data() });
                        setLoading(false);
                    }, error => {
                        console.error('Error buscando mi equipo:', error);
                        setLoading(false);
                    });

                const unsubAnn = db.collection('artifacts/academic-platform/announcements')
                    .where('courseId', '==', courseId)
                    .onSnapshot(snap => {
                        setAnnouncements(snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || '').localeCompare(a.date || '')));
                    }, error => console.error('Error escuchando anuncios:', error));

                return () => { unsubTeam(); unsubAnn(); };
            }, [role, currentUser.uid, courseId]);

            React.useEffect(() => {
                if (role !== 'student' || !myTeam) { setMyProgress(null); return; }
                const unsub = db.doc(`artifacts/academic-platform/progress/${myTeam.id}`).onSnapshot(snap => {
                    setMyProgress(snap.exists ? snap.data() : {});
                }, error => console.error('Error escuchando mi progreso:', error));
                return () => unsub();
            }, [role, myTeam?.id]);

            React.useEffect(() => {
                if (role !== 'student' || !myProgress) return;
                const firstOpen = EXPEDITION_MISSIONS.find(m => (myProgress[String(m.wk)] ? myProgress[String(m.wk)].status : 'open') !== 'done');
                setActiveWeek(firstOpen ? firstOpen.wk : 12);
            }, [role, myTeam?.id, !!myProgress]);

            React.useEffect(() => {
                const wk = String(activeWeek);
                setNoteInput((myProgress && myProgress[wk] && myProgress[wk].note) || '');
                const existingLinks = (myProgress && myProgress[wk] && myProgress[wk].links) || [];
                setLinkInputs(existingLinks.length > 0 ? existingLinks : ['']);
            }, [activeWeek, myTeam?.id]);

            const updateLinkInput = (index, value) => {
                setLinkInputs(prev => prev.map((l, i) => i === index ? value : l));
            };
            const addLinkInput = () => setLinkInputs(prev => [...prev, '']);
            const removeLinkInput = (index) => {
                setLinkInputs(prev => prev.length <= 1 ? [''] : prev.filter((_, i) => i !== index));
            };

            const submitMission = async () => {
                if (!myTeam) return;
                setSubmitting(true);
                try {
                    const wk = String(activeWeek);
                    const existing = (myProgress && myProgress[wk]) || {};
                    const links = linkInputs.map(l => l.trim()).filter(Boolean);
                    await db.doc(`artifacts/academic-platform/progress/${myTeam.id}`).set({
                        [wk]: {
                            status: 'submitted',
                            note: noteInput.trim(),
                            links,
                            crystals: existing.crystals || 0,
                            submittedAt: new Date().toISOString()
                        }
                    }, { merge: true });
                    toast.showToast('Entrega enviada. Espera la revisión del profesor.', 'success');
                } catch (error) {
                    console.error('Error enviando la entrega:', error);
                    toast.showToast('Error enviando la entrega', 'error');
                } finally {
                    setSubmitting(false);
                }
            };

            // ===== Helpers compartidos =====
            const teamCrystals = (progress) => {
                if (!progress) return 0;
                return Object.values(progress).reduce((sum, wk) => sum + (wk.crystals || 0), 0);
            };
            const phaseCrystals = (progress, phase) => {
                if (!progress) return 0;
                return EXPEDITION_MISSIONS.filter(m => m.phase === phase)
                    .reduce((sum, m) => sum + ((progress[String(m.wk)] && progress[String(m.wk)].crystals) || 0), 0);
            };
            const phaseMax = (phase) => EXPEDITION_MISSIONS.filter(m => m.phase === phase).length * EXPEDITION_MAX_PER_MISSION;
            const statusOf = (progress, wk) => (progress && progress[String(wk)] && progress[String(wk)].status) || 'open';

            // La misión 1 siempre está desbloqueada; cualquier otra se
            // desbloquea en cuanto la anterior deja de estar 'open' (o sea,
            // en cuanto el equipo la envía a revisión — no hace falta
            // esperar a que el profesor la califique).
            const isMissionUnlocked = (progress, wk) => wk === 1 || statusOf(progress, wk - 1) !== 'open';

            if (loading) {
                return <LoadingSpinner />;
            }

            // Mapa de camino tipo "Clash of Clans": nodos numerados unidos por
            // un camino punteado, en el mismo espacio que antes ocupaban las
            // 12 tarjetas. Solo muestra el número (o un candado si está
            // bloqueada); el detalle completo se ve abajo al seleccionarla.
            const renderJourney = (progress, onSelect) => {
                // En móvil el mapa se ve el doble de alto, con nodos y líneas
                // el doble de grandes/gruesas — el orden y la forma del
                // recorrido son los mismos, solo escalados. El viewBox es un
                // atributo SVG (no CSS), así que hay que recalcular todo en
                // JS según isMobile en vez de resolverlo con media queries.
                const scale = isMobile ? 2 : 1;
                const mapH = 460 * scale;
                const nodeR = 34 * scale;
                const pos = (wk) => {
                    const p = EXPEDITION_MAP_POSITIONS[wk];
                    return { x: p.x, y: p.y * scale };
                };
                return (
                    <div className="mb-6 rounded-xl overflow-hidden" style={{ border: '1px solid var(--border-color)' }}>
                        <svg viewBox={`0 0 1200 ${mapH}`} style={{ width: '100%', height: 'auto', display: 'block' }}>
                            <style>{`
                                .expedition-node-unlocked { transition: transform 0.15s ease, filter 0.15s ease; transform-box: fill-box; transform-origin: center; cursor: pointer; }
                                .expedition-node-unlocked:hover, .expedition-node-active { transform: scale(1.1); filter: brightness(1.12) drop-shadow(0 4px 6px rgba(0,0,0,0.25)); }
                            `}</style>
                            <defs>
                                <radialGradient id="expNodeGreen" cx="35%" cy="30%" r="75%">
                                    <stop offset="0%" stopColor="#4ade80" />
                                    <stop offset="100%" stopColor="#15803d" />
                                </radialGradient>
                                <radialGradient id="expNodeBlue" cx="35%" cy="30%" r="75%">
                                    <stop offset="0%" stopColor="#60a5fa" />
                                    <stop offset="100%" stopColor="#1d4ed8" />
                                </radialGradient>
                                <radialGradient id="expNodeOrange" cx="35%" cy="30%" r="75%">
                                    <stop offset="0%" stopColor="#fb923c" />
                                    <stop offset="100%" stopColor="#c2410c" />
                                </radialGradient>
                            </defs>
                            <image href="assets/expedition-map-bg.png" x="0" y="0" width="1200" height={mapH} preserveAspectRatio="xMidYMid slice" />
                            {EXPEDITION_MISSIONS.slice(0, -1).map((m, i) => {
                                const a = pos(m.wk);
                                const b = pos(m.wk + 1);
                                const midX = (a.x + b.x) / 2;
                                const unlockedB = isMissionUnlocked(progress, m.wk + 1);
                                let c1, c2;
                                if (m.wk === 5 || m.wk === 8) {
                                    // Entra al nodo siguiente por ARRIBA.
                                    c1 = { x: midX, y: a.y };
                                    c2 = { x: b.x, y: b.y - 60 * scale };
                                } else if (m.wk === 6 || m.wk === 9) {
                                    // Sale del nodo actual por ABAJO.
                                    c1 = { x: a.x, y: a.y + 60 * scale };
                                    c2 = { x: midX, y: b.y };
                                } else {
                                    // Ola vertical decorativa alternada: sin esto,
                                    // los tramos donde ambos nodos tienen una altura
                                    // parecida se ven casi rectos. El signo alterna
                                    // por tramo para que el camino ondule de forma
                                    // pareja en vez de solo curvarse donde la
                                    // diferencia de altura entre nodos ya es grande.
                                    const wave = (i % 2 === 0) ? -45 : 45;
                                    c1 = { x: a.x + (b.x - a.x) * 0.33, y: a.y + wave * scale };
                                    c2 = { x: a.x + (b.x - a.x) * 0.66, y: b.y + wave * scale };
                                }
                                return (
                                    <path
                                        key={m.wk}
                                        d={`M ${a.x},${a.y} C ${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`}
                                        fill="none"
                                        stroke="#3f3f46"
                                        strokeWidth={6 * scale}
                                        strokeDasharray={`${9 * scale} ${9 * scale}`}
                                        strokeLinecap="round"
                                        opacity={unlockedB ? 0.85 : 0.35}
                                    />
                                );
                            })}
                            {EXPEDITION_MISSIONS.map(m => {
                                const p = pos(m.wk);
                                const st = statusOf(progress, m.wk);
                                const unlocked = isMissionUnlocked(progress, m.wk);
                                const isActive = activeWeek === m.wk;
                                let fill = 'url(#expNodeOrange)', stroke = '#c2410c'; // desbloqueada y abierta: misión actual
                                if (!unlocked) { fill = 'rgba(255,255,255,0.55)'; stroke = 'rgba(255,255,255,0.85)'; }
                                else if (st === 'done') { fill = 'url(#expNodeGreen)'; stroke = '#16a34a'; }
                                else if (st === 'submitted') { fill = 'url(#expNodeBlue)'; stroke = '#1d4ed8'; }
                                return (
                                    <g
                                        key={m.wk}
                                        onClick={() => unlocked && onSelect(m.wk)}
                                        className={`${unlocked ? 'expedition-node-unlocked' : ''} ${isActive ? 'expedition-node-active' : ''}`.trim()}
                                        style={{ cursor: unlocked ? 'pointer' : 'not-allowed' }}
                                    >
                                        {isActive && (
                                            <circle cx={p.x} cy={p.y} r={nodeR + 8 * scale} fill="none" stroke={EXPEDITION_PHASES[m.phase].color} strokeWidth={3 * scale} />
                                        )}
                                        <circle cx={p.x} cy={p.y} r={nodeR} fill={fill} stroke={stroke} strokeWidth={3 * scale} />
                                        <text x={p.x} y={p.y} textAnchor="middle" dominantBaseline="central" fontSize={(unlocked ? 26 : 22) * scale} fontWeight="bold" fill={unlocked ? '#fff' : 'var(--text-secondary)'}>
                                            {unlocked ? m.wk : '🔒'}
                                        </text>
                                    </g>
                                );
                            })}
                        </svg>
                    </div>
                );
            };

            const header = (
                <div className="flex justify-between items-center mb-6">
                    <div>
                        <h1 className="text-2xl font-bold" style={{ color: 'var(--text-primary)' }}>🧭 Expedición Doble Diamante</h1>
                        <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>{courseName} · Diseño e investigación en 12 semanas</p>
                    </div>
                    <button onClick={onBack} className="btn btn-secondary">
                        <span className="hidden sm:inline">← Volver</span>
                        <span className="sm:hidden">←</span>
                    </button>
                </div>
            );

            // ================= VISTA PROFESOR =================
            if (role === 'professor') {
                const sortedTeams = [...profTeams].sort((a, b) => teamCrystals(profProgressByTeam[b.id]) - teamCrystals(profProgressByTeam[a.id]));
                const pendingReviews = [];
                profTeams.forEach(team => {
                    const progress = profProgressByTeam[team.id] || {};
                    Object.entries(progress).forEach(([wk, data]) => {
                        if (data.status === 'submitted') {
                            const mission = EXPEDITION_MISSIONS.find(m => m.wk === Number(wk));
                            pendingReviews.push({ team, wk: Number(wk), mission, note: data.note, links: data.links || [] });
                        }
                    });
                });

                return (
                    <div className="min-h-screen p-4 md:p-8" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <div className="max-w-6xl mx-auto">
                            {header}

                            <div className="flex gap-2 mb-6 border-b" style={{ borderColor: 'var(--border-color)' }}>
                                {[
                                    { id: 'overview', label: 'Visión general' },
                                    { id: 'review', label: `Revisar envíos (${pendingReviews.length})` },
                                    { id: 'teams', label: 'Equipos' },
                                    { id: 'announce', label: 'Anuncios' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setProfTab(tab.id)}
                                        className="px-3 py-2 text-sm font-semibold"
                                        style={{
                                            color: profTab === tab.id ? 'var(--accent-color)' : 'var(--text-secondary)',
                                            borderBottom: profTab === tab.id ? '2px solid var(--accent-color)' : '2px solid transparent'
                                        }}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {profTab === 'overview' && (
                                <div className="card rounded-xl p-6">
                                    <h2 className="text-lg font-bold mb-4" style={{ color: 'var(--text-primary)' }}>Tablero de comando</h2>
                                    {sortedTeams.length === 0 ? (
                                        <p style={{ color: 'var(--text-secondary)' }}>Aún no hay equipos. Ve a la pestaña "Equipos" para crear el primero.</p>
                                    ) : (
                                        sortedTeams.map((team, i) => (
                                            <div key={team.id} className="flex items-center justify-between py-2 border-b" style={{ borderColor: 'var(--border-color)' }}>
                                                <span style={{ color: 'var(--text-secondary)' }}>#{i + 1}</span>
                                                <span className="flex-1 mx-3 font-semibold" style={{ color: 'var(--text-primary)' }}>{team.name}</span>
                                                <span className="font-mono" style={{ color: 'var(--accent-color)' }}>{teamCrystals(profProgressByTeam[team.id])} 💎</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {profTab === 'review' && (
                                <div className="card rounded-xl p-6">
                                    <h2 className="text-lg font-bold mb-2" style={{ color: 'var(--text-primary)' }}>Envíos pendientes</h2>
                                    <p className="text-sm mb-4" style={{ color: 'var(--text-secondary)' }}>Asigna cristales (de 10 en 10, hasta {EXPEDITION_MAX_PER_MISSION}) a cada entrega.</p>
                                    {pendingReviews.length === 0 ? (
                                        <p style={{ color: 'var(--text-secondary)' }}>No hay envíos pendientes por revisar.</p>
                                    ) : (
                                        pendingReviews.map(item => (
                                            <div key={`${item.team.id}-${item.wk}`} className="border rounded-lg p-4 mb-3" style={{ borderColor: 'var(--border-color)' }}>
                                                <div className="text-xs uppercase font-mono mb-1" style={{ color: 'var(--text-secondary)' }}>
                                                    {item.team.name} · Semana {item.wk} · {item.mission ? item.mission.title : ''}
                                                </div>
                                                {item.links.length > 0 ? (
                                                    <ul className="mb-2 list-disc list-inside">
                                                        {item.links.map((link, i) => (
                                                            <li key={i} className="text-sm">
                                                                <a href={link} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline break-all">{link}</a>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                ) : (
                                                    <p className="text-sm mb-2" style={{ color: 'var(--text-secondary)' }}>Sin enlaces adjuntos.</p>
                                                )}
                                                <p className="text-sm mb-3" style={{ color: 'var(--text-primary)' }}>{item.note || 'Sin comentario adjunto.'}</p>
                                                <label className="block text-xs font-bold mb-1" style={{ color: 'var(--text-primary)' }}>Feedback para el equipo (opcional)</label>
                                                <textarea
                                                    className="input-field w-full py-2 px-3 rounded-lg mb-3 text-sm"
                                                    rows="2"
                                                    placeholder="Explica por qué asignas esta cantidad de cristales..."
                                                    value={reviewFeedback[`${item.team.id}-${item.wk}`] || ''}
                                                    onChange={(e) => setReviewFeedback(prev => ({ ...prev, [`${item.team.id}-${item.wk}`]: e.target.value }))}
                                                ></textarea>
                                                <div className="flex gap-2 items-center">
                                                    <div className="flex items-center gap-1">
                                                        <select
                                                            className="input-field py-2 px-3 rounded-lg w-28"
                                                            value={reviewInputs[`${item.team.id}-${item.wk}`] || ''}
                                                            onChange={(e) => setReviewInputs(prev => ({ ...prev, [`${item.team.id}-${item.wk}`]: e.target.value }))}
                                                        >
                                                            <option value="">Elegir...</option>
                                                            {Array.from({ length: (EXPEDITION_MAX_PER_MISSION / 10) + 1 }, (_, i) => i * 10).map(v => (
                                                                <option key={v} value={v}>{v}</option>
                                                            ))}
                                                        </select>
                                                        <span className="text-xl" title="cristales">💎</span>
                                                    </div>
                                                    <button onClick={() => gradeSubmission(item.team.id, item.wk)} className="btn btn-primary text-sm">Registrar revisión</button>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}

                            {profTab === 'teams' && (
                                <div>
                                    <div className="card rounded-xl p-6 mb-6">
                                        <h2 className="text-lg font-bold mb-4" style={{ color: 'var(--text-primary)' }}>Crear equipo</h2>
                                        <div className="flex flex-col md:flex-row gap-3 items-start md:items-center">
                                            <input
                                                type="text" placeholder="Nombre del equipo"
                                                className="input-field py-2 px-3 rounded-lg flex-1 w-full md:w-auto"
                                                value={newTeamName}
                                                onChange={(e) => setNewTeamName(e.target.value)}
                                            />
                                            <button onClick={createTeam} className="btn btn-primary text-sm whitespace-nowrap">+ Crear equipo</button>
                                        </div>

                                        <h3 className="text-sm font-bold mt-6 mb-2" style={{ color: 'var(--text-primary)' }}>Roster de {courseName}</h3>
                                        <p className="text-xs" style={{ color: 'var(--text-secondary)' }}>
                                            {rosterStudents.length > 0
                                                ? `Usa el selector "+ Agregar del roster" junto a cada equipo para sumar estudiantes de ${courseName} (${rosterStudents.length} en el roster).`
                                                : 'Este curso todavía no tiene estudiantes aprobados en el roster.'}
                                        </p>
                                    </div>

                                    <h2 className="text-lg font-bold mb-4" style={{ color: 'var(--text-primary)' }}>Equipos registrados ({profTeams.length})</h2>
                                    {profTeams.length === 0 ? (
                                        <p style={{ color: 'var(--text-secondary)' }}>Aún no hay equipos.</p>
                                    ) : (
                                        <div className="grid md:grid-cols-3 gap-6">
                                            {profTeams.map(team => {
                                                // Un estudiante solo puede pertenecer a un equipo de la Expedición:
                                                // se excluyen del selector los que ya están en CUALQUIER equipo de
                                                // este curso, no solo en el equipo actual.
                                                const assignedElsewhere = new Set(profTeams.flatMap(t => t.memberUids || []));
                                                const availableForThisTeam = rosterStudents
                                                    .filter(s => !assignedElsewhere.has(s.id))
                                                    .sort((a, b) => (a.fullName || a.email || '').localeCompare(b.fullName || b.email || ''));
                                                return (
                                                    <div key={team.id} className="card rounded-xl p-6">
                                                        {editingTeamId === team.id ? (
                                                            <div className="flex gap-2 items-center mb-2">
                                                                <input
                                                                    type="text" autoFocus
                                                                    className="input-field flex-1 py-1 px-2 rounded text-sm"
                                                                    value={editTeamName}
                                                                    onChange={(e) => setEditTeamName(e.target.value)}
                                                                    onKeyDown={(e) => { if (e.key === 'Enter') renameTeam(team.id, editTeamName); if (e.key === 'Escape') setEditingTeamId(null); }}
                                                                />
                                                                <button onClick={() => renameTeam(team.id, editTeamName)} className="text-xs text-green-600 hover:underline whitespace-nowrap">Guardar</button>
                                                                <button onClick={() => setEditingTeamId(null)} className="text-xs hover:underline whitespace-nowrap" style={{ color: 'var(--text-secondary)' }}>Cancelar</button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className="font-semibold" style={{ color: 'var(--text-primary)' }}>{team.name}</span>
                                                                <div className="flex gap-3">
                                                                    <button onClick={() => { setEditingTeamId(team.id); setEditTeamName(team.name); }} className="text-xs hover:underline" style={{ color: 'var(--text-secondary)' }}>Editar</button>
                                                                    <button onClick={() => deleteTeam(team.id)} className="text-xs text-red-600 hover:underline">Eliminar</button>
                                                                </div>
                                                            </div>
                                                        )}
                                                        <div className="space-y-1 mb-3">
                                                            {(team.memberUids || []).length === 0 ? (
                                                                <p className="text-xs" style={{ color: 'var(--text-secondary)' }}>Sin integrantes todavía.</p>
                                                            ) : (
                                                                (team.memberUids || []).map(uid => (
                                                                    <div key={uid} className="flex justify-between items-center text-sm">
                                                                        <span style={{ color: 'var(--text-primary)' }}>
                                                                            {(knownStudents[uid] && (knownStudents[uid].fullName || knownStudents[uid].email)) || uid}
                                                                        </span>
                                                                        <button onClick={() => removeMember(team.id, uid)} className="text-xs text-red-500 hover:underline">Quitar</button>
                                                                    </div>
                                                                ))
                                                            )}
                                                        </div>
                                                        {availableForThisTeam.length > 0 && (
                                                            <div className="mb-2">
                                                                <select
                                                                    className="input-field w-full py-1.5 px-2 rounded text-sm"
                                                                    value=""
                                                                    onChange={(e) => { if (e.target.value) addMemberUid(team.id, e.target.value); }}
                                                                >
                                                                    <option value="">+ Agregar del roster...</option>
                                                                    {availableForThisTeam.map(s => (
                                                                        <option key={s.id} value={s.id}>{s.fullName || s.email}</option>
                                                                    ))}
                                                                </select>
                                                            </div>
                                                        )}
                                                        <div className="flex gap-2">
                                                            <input
                                                                type="email" placeholder="correo@institucion.edu.co"
                                                                className="input-field flex-1 py-1.5 px-2 rounded text-sm"
                                                                value={emailToAdd[team.id] || ''}
                                                                onChange={(e) => setEmailToAdd(prev => ({ ...prev, [team.id]: e.target.value }))}
                                                            />
                                                            <button onClick={() => addMemberByEmail(team.id)} className="btn btn-secondary text-xs px-3">+ Por correo</button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {profTab === 'announce' && (
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div className="card rounded-xl p-6">
                                        <h2 className="text-lg font-bold mb-4" style={{ color: 'var(--text-primary)' }}>Nueva transmisión</h2>
                                        <textarea
                                            className="input-field w-full py-2 px-3 rounded-lg mb-3"
                                            rows="3"
                                            placeholder="Ej: Nueva señal detectada — recuerden anexar evidencia visual."
                                            value={announcementText}
                                            onChange={(e) => setAnnouncementText(e.target.value)}
                                        ></textarea>
                                        <button onClick={publishAnnouncement} className="btn btn-primary text-sm">Enviar transmisión</button>
                                    </div>
                                    <div className="card rounded-xl p-6">
                                        <h2 className="text-lg font-bold mb-4" style={{ color: 'var(--text-primary)' }}>Historial</h2>
                                        {announcements.length === 0 ? (
                                            <p style={{ color: 'var(--text-secondary)' }}>Sin transmisiones todavía.</p>
                                        ) : (
                                            announcements.map(a => (
                                                <div key={a.id} className="border-l-4 rounded p-3 mb-2 text-sm" style={{ borderColor: 'var(--accent-color)', backgroundColor: 'var(--bg-primary)' }}>
                                                    <div className="text-xs uppercase" style={{ color: 'var(--text-secondary)' }}>{new Date(a.date).toLocaleString('es-CO')}</div>
                                                    <p style={{ color: 'var(--text-primary)' }}>{a.text}</p>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // ================= VISTA ESTUDIANTE =================
            if (!myTeam) {
                return (
                    <div className="min-h-screen p-4 md:p-8" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <div className="max-w-3xl mx-auto">
                            {header}
                            <div className="card rounded-xl p-8 text-center">
                                <p style={{ color: 'var(--text-secondary)' }}>Aún no perteneces a ningún equipo de la expedición. Pídele a tu profesor que te agregue.</p>
                            </div>
                        </div>
                    </div>
                );
            }

            const mission = EXPEDITION_MISSIONS.find(m => m.wk === activeWeek);
            const phaseMeta = EXPEDITION_PHASES[mission.phase];
            const currentEntry = (myProgress && myProgress[String(activeWeek)]) || { status: 'open', note: '', crystals: 0 };
            const crystalsTotal = teamCrystals(myProgress);
            const totalMax = EXPEDITION_MISSIONS.length * EXPEDITION_MAX_PER_MISSION;

            return (
                <div className="min-h-screen p-4 md:p-8" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    <div className="max-w-6xl mx-auto">
                        {header}
                        <div className="mb-2">
                            <span className="text-xs uppercase font-mono" style={{ color: 'var(--text-secondary)' }}>Tripulación</span>
                            <h2 className="text-xl font-bold" style={{ color: 'var(--text-primary)' }}>{myTeam.name}</h2>
                        </div>

                        {renderJourney(myProgress, setActiveWeek)}

                        <div className="grid md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 card rounded-xl p-6">
                                <div className="text-xs uppercase font-mono mb-1" style={{ color: phaseMeta.color }}>
                                    Fase {mission.phase} · {phaseMeta.name} — Semana {mission.wk}
                                </div>
                                <h3 className="text-lg font-bold mb-2" style={{ color: 'var(--text-primary)' }}>{mission.title}</h3>
                                <p className="text-sm mb-4" style={{ color: 'var(--text-secondary)' }}>{mission.objective}</p>
                                <div className="space-y-2 mb-4">
                                    {mission.tasks.map((t, i) => (
                                        <div key={i} className="flex gap-2 text-sm" style={{ color: 'var(--text-primary)' }}>
                                            <span>•</span><span>{t}</span>
                                        </div>
                                    ))}
                                </div>
                                <div className="rounded-lg p-4 mb-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
                                    <div className="text-xs uppercase font-bold mb-1" style={{ color: 'var(--warning-color, #f59e0b)' }}>Entregable</div>
                                    <p className="text-sm" style={{ color: 'var(--text-primary)' }}>{mission.deliverable}</p>
                                </div>

                                {currentEntry.status === 'done' ? (
                                    <div>
                                        <p className="text-xs mb-3" style={{ color: 'var(--text-secondary)' }}>Esta entrega ya fue calificada y no se puede modificar.</p>
                                        <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>Enlaces del entregable</label>
                                        {(currentEntry.links || []).length > 0 ? (
                                            <ul className="mb-3 list-disc list-inside">
                                                {currentEntry.links.map((link, i) => (
                                                    <li key={i} className="text-sm">
                                                        <a href={link} target="_blank" rel="noopener noreferrer" className="text-blue-600 hover:underline break-all">{link}</a>
                                                    </li>
                                                ))}
                                            </ul>
                                        ) : (
                                            <p className="text-sm mb-3" style={{ color: 'var(--text-secondary)' }}>Sin enlaces adjuntos.</p>
                                        )}
                                        {currentEntry.note && (
                                            <>
                                                <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>Bitácora de envío</label>
                                                <p className="text-sm mb-3" style={{ color: 'var(--text-primary)' }}>{currentEntry.note}</p>
                                            </>
                                        )}
                                        {currentEntry.feedback && (
                                            <div className="rounded-lg p-4 mt-4" style={{ backgroundColor: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>
                                                <div className="text-xs uppercase font-bold mb-1" style={{ color: 'var(--accent-color)' }}>Feedback del profesor</div>
                                                <p className="text-sm" style={{ color: 'var(--text-primary)' }}>{currentEntry.feedback}</p>
                                            </div>
                                        )}
                                        <div className="rounded-lg p-4 mt-4" style={{ backgroundColor: 'var(--bg-primary)', border: '1px solid var(--border-color)' }}>
                                            <div className="text-xs uppercase font-bold mb-1" style={{ color: 'var(--accent-color)' }}>Estado</div>
                                            <p className="text-sm" style={{ color: 'var(--text-primary)' }}>Revisada — {currentEntry.crystals} 💎</p>
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>Enlaces del entregable</label>
                                        <p className="text-xs mb-2" style={{ color: 'var(--text-secondary)' }}>Agrega uno o más enlaces según el tipo de evidencia (Figma, Google Drive, Behance, etc.).</p>
                                        <div className="space-y-2 mb-3">
                                            {linkInputs.map((link, i) => (
                                                <div key={i} className="flex gap-2">
                                                    <input
                                                        type="url"
                                                        placeholder="https://..."
                                                        className="input-field flex-1 py-2 px-3 rounded-lg"
                                                        value={link}
                                                        onChange={(e) => updateLinkInput(i, e.target.value)}
                                                    />
                                                    <button
                                                        onClick={() => removeLinkInput(i)}
                                                        className="text-xs text-red-500 hover:underline px-2"
                                                        title="Quitar enlace"
                                                    >
                                                        Quitar
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={addLinkInput} className="btn btn-secondary text-xs px-3 mb-4">+ Agregar otro enlace</button>

                                        <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>Bitácora de envío (opcional)</label>
                                        <textarea
                                            className="input-field w-full py-2 px-3 rounded-lg mb-3"
                                            rows="4"
                                            placeholder="Comentario o resumen de lo entregado..."
                                            value={noteInput}
                                            onChange={(e) => setNoteInput(e.target.value)}
                                        ></textarea>
                                        <div className="flex items-center gap-3">
                                            <button onClick={submitMission} disabled={submitting} className="btn btn-primary text-sm">
                                                {currentEntry.status === 'open' ? 'Enviar a revisión' : 'Actualizar envío'}
                                            </button>
                                            {currentEntry.status !== 'open' && (
                                                <span className="text-sm" style={{ color: 'var(--text-secondary)' }}>
                                                    Estado: <strong style={{ color: 'var(--text-primary)' }}>En revisión</strong>
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div>
                                <div className="card rounded-xl p-6 mb-4 text-center">
                                    <div className="text-3xl font-bold" style={{ color: 'var(--accent-color)' }}>{crystalsTotal} 💎</div>
                                    <div className="text-xs uppercase" style={{ color: 'var(--text-secondary)' }}>cristales de insight</div>
                                    <div className="w-full bg-gray-200 rounded-full h-2 mt-3">
                                        <div className="h-2 rounded-full" style={{ width: `${Math.min(100, Math.round((crystalsTotal / totalMax) * 100))}%`, backgroundColor: 'var(--accent-color)' }}></div>
                                    </div>
                                    <p className="text-xs mt-2" style={{ color: 'var(--text-secondary)' }}>{crystalsTotal} / {totalMax} posibles</p>
                                </div>

                                <div className="card rounded-xl p-6 mb-4">
                                    <h3 className="text-sm font-bold mb-3" style={{ color: 'var(--text-primary)' }}>Progreso por fase</h3>
                                    {[1, 2, 3, 4].map(ph => {
                                        const c = phaseCrystals(myProgress, ph);
                                        const mx = phaseMax(ph);
                                        const pct = mx ? Math.round((c / mx) * 100) : 0;
                                        return (
                                            <div key={ph} className="mb-3">
                                                <div className="flex justify-between text-xs mb-1" style={{ color: 'var(--text-secondary)' }}>
                                                    <span>{EXPEDITION_PHASES[ph].name}</span><span>{c}/{mx}</span>
                                                </div>
                                                <div className="w-full bg-gray-200 rounded-full h-1.5">
                                                    <div className="h-1.5 rounded-full" style={{ width: `${pct}%`, backgroundColor: EXPEDITION_PHASES[ph].color }}></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {announcements.length > 0 && (
                                    <div className="card rounded-xl p-6">
                                        <h3 className="text-sm font-bold mb-3" style={{ color: 'var(--text-primary)' }}>Transmisiones</h3>
                                        {announcements.slice(0, 5).map(a => (
                                            <div key={a.id} className="border-l-4 rounded p-2 mb-2 text-xs" style={{ borderColor: 'var(--accent-color)', backgroundColor: 'var(--bg-primary)' }}>
                                                <div style={{ color: 'var(--text-secondary)' }}>{new Date(a.date).toLocaleDateString('es-CO')}</div>
                                                <p style={{ color: 'var(--text-primary)' }}>{a.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AppContent() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [userData, setUserData] = React.useState(null);
            const [authReady, setAuthReady] = React.useState(false);
            const toast = useToast();

            const firebaseConfig = {
                apiKey: "AIzaSyBEKzy25wj-qIVJcyqkCors2b8zPostu7E",
                authDomain: "seminario-de-investigaci-283c8.firebaseapp.com",
                projectId: "seminario-de-investigaci-283c8",
                storageBucket: "seminario-de-investigaci-283c8.firebasestorage.app",
                messagingSenderId: "253114435967",
                appId: "1:253114435967:web:b83b9413f663f283b7724a",
                measurementId: "G-7J76P5D7Z3"
            };

            React.useEffect(() => {
                firebase.initializeApp(firebaseConfig);
                const auth = firebase.auth();

                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    setCurrentUser(user);

                    if (user) {
                        try {
                            const db = firebase.firestore();

                            // Primero buscar en profesores
                            let userDoc = await db.doc(`artifacts/academic-platform/professors/${user.uid}/profile/data`).get();

                            if (userDoc.exists) {
                                setUserData({ ...userDoc.data(), userType: 'professor' });
                            } else {
                                setUserData({ userType: 'student' });
                            }
                        } catch (error) {
                            console.error('Error cargando datos del usuario:', error);
                        }
                    } else {
                        setUserData(null);
                    }

                    setAuthReady(true);
                });

                return () => unsubscribe();
            }, []);

            if (!authReady) {
                return <LoadingSpinner />;
            }

            return (
                <>
                    {currentUser ? (
                        userData?.userType === 'professor' ? (
                            <AdminDashboard currentUser={currentUser} />
                        ) : (
                            <CoursePage currentUser={currentUser} />
                        )
                    ) : (
                        <AuthPage />
                    )}
                </>
            );
        }

        function App() {
            return (
                <ToastProvider>
                    <AppContent />
                </ToastProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>

</html>
