            const [forceShowQR, setForceShowQR] = React.useState(false);
            const [showQRTimeWarning, setShowQRTimeWarning] = React.useState(false);
            const scannerRef = React.useRef(null);
            const [qrZoomSupported, setQrZoomSupported] = React.useState(false);
            const [qrZoomValue, setQrZoomValue] = React.useState(1);
            const [qrZoomMin, setQrZoomMin] = React.useState(1);
            const [qrZoomMax, setQrZoomMax] = React.useState(1);
            const [qrZoomStep, setQrZoomStep] = React.useState(0.1);
            const [qrNativeZoomMax, setQrNativeZoomMax] = React.useState(1);
            const [qrScannerErrorDetail, setQrScannerErrorDetail] = React.useState('');
            const [qrScannerAttemptLogs, setQrScannerAttemptLogs] = React.useState([]);
            const qrScannerStartInProgressRef = React.useRef(false);
            const pinchStartDistanceRef = React.useRef(null);
            const pinchStartZoomRef = React.useRef(1);
            const courseDataReadyRef = React.useRef(false);
            const scanHandledRef = React.useRef(false);
            const [profileData, setProfileData] = React.useState({
                fullName: '',
                currentPassword: '',
                newPassword: '',
                confirmPassword: ''
            });

            const getTouchDistance = (touches) => {
                if (!touches || touches.length < 2) {
                    return 0;
                }

                const [firstTouch, secondTouch] = touches;
                const deltaX = firstTouch.clientX - secondTouch.clientX;
                const deltaY = firstTouch.clientY - secondTouch.clientY;
                return Math.hypot(deltaX, deltaY);
            };

            const clampQRZoom = (zoomLevel) => {
                return Math.min(qrZoomMax, Math.max(qrZoomMin, zoomLevel));
            };

            const appendQRLog = (message) => {
                const now = new Date().toLocaleTimeString();
                const line = `[${now}] ${message}`;
                console.log('[QR-SCANNER]', line);
                setQrScannerAttemptLogs((prevLogs) => [...prevLogs, line]);
            };

            const formatQRError = (error) => {
                if (!error) {
                    return 'Error desconocido';
                }

                if (typeof error === 'string') {
                    return error;
                }

                const errorName = error?.name || 'Error';
                const errorMessage = error?.message || error?.toString?.() || 'Sin mensaje';
                return `${errorName}: ${errorMessage}`;
            };

            const applyQRZoom = async (zoomLevel) => {
                if (!scannerRef.current || !qrZoomSupported) {
                    return;
                }

                try {
                    const nativeMax = Math.max(1, qrNativeZoomMax);
                    const nativeZoomLevel = Math.min(zoomLevel, nativeMax);
                    const digitalScale = Math.max(1, zoomLevel / nativeZoomLevel);

                    if (nativeMax > 1) {
                        await scannerRef.current.applyVideoConstraints({
                            advanced: [{ zoom: nativeZoomLevel }]
                        });
                    }

                    const videoElement = document.querySelector('#qr-reader video');
                    if (videoElement) {
                        videoElement.style.transformOrigin = 'center center';
                        videoElement.style.transform = `scale(${digitalScale})`;
                    }
                } catch (error) {
                    console.error('Error aplicando zoom de cámara:', error);
                }
            };

            const handleQRZoomChange = async (zoomLevel) => {
                const numericZoom = Number(zoomLevel);
                const clampedZoom = clampQRZoom(numericZoom);
                setQrZoomValue(clampedZoom);
                await applyQRZoom(clampedZoom);
            };

            const handleQRPinchStart = (event) => {
                if (!qrZoomSupported || event.touches.length !== 2) {
                    return;
                }

                event.preventDefault();
                pinchStartDistanceRef.current = getTouchDistance(event.touches);
                pinchStartZoomRef.current = qrZoomValue;
            };

            const handleQRPinchMove = async (event) => {
                if (!qrZoomSupported || event.touches.length !== 2 || !pinchStartDistanceRef.current) {
                    return;
                }

                event.preventDefault();

                const currentDistance = getTouchDistance(event.touches);
                if (!currentDistance) {
                    return;
                }

                const scaleFactor = currentDistance / pinchStartDistanceRef.current;
                const targetZoom = pinchStartZoomRef.current * scaleFactor;
                const clampedTargetZoom = clampQRZoom(targetZoom);

                if (Math.abs(clampedTargetZoom - qrZoomValue) >= Math.max(qrZoomStep, 0.05)) {
                    setQrZoomValue(clampedTargetZoom);
                    await applyQRZoom(clampedTargetZoom);
                }
            };

            const handleQRPinchEnd = () => {
                pinchStartDistanceRef.current = null;
            };

            const courseCodeExists = async (code) => {
                // collectionGroup en vez de recorrer professors -> courses: la
                // mayoría de los docs professors/{uid} son "fantasma" (solo
                // contenedor, sin datos propios) y una consulta normal de
                // colección los salta por completo, dejando invisibles los
                // cursos de esos profesores.
                const snap = await db.collectionGroup('courses').where('courseCode', '==', code).get();
                return !snap.empty;
            };

            const handleFixPendingCode = async (e) => {
                e.preventDefault();
                let code = pendingCodeInput.trim();
                if (code && !code.startsWith('#')) code = '#' + code;

                if (!code.startsWith('#') || code.length < 2) {
                    toast.showToast('Ingresa un código de curso válido (#codigo)', 'error');
                    return;
                }

                setFixingPendingCode(true);
                try {
                    const valid = await courseCodeExists(code);
                    if (!valid) {
                        toast.showToast('Ese código de curso no existe. Verifica con tu profesor.', 'error');
                        return;
                    }

                    await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`).update({ courseCode: code });
                    toast.showToast('Código actualizado. Esperando aprobación del profesor.', 'success');
                    setEditingPendingCode(false);
                    setPendingCodeInput('');
                    loadCourseData();
                } catch (error) {
                    console.error('Error actualizando código de curso:', error);
                    toast.showToast('Error actualizando el código', 'error');
                } finally {
                    setFixingPendingCode(false);
                }
            };

            const handleJoinCourse = async (e) => {
                e.preventDefault();
                if (!joinCourseCode.startsWith('#')) {
                    toast.showToast('El código debe comenzar con #', 'error');
                    return;
                }

                if (!courseDataReadyRef.current) {
                    // Evita registrar el nombre real del estudiante con un
                    // valor de respaldo (ej. el usuario del correo) mientras
                    // loadCourseData() todavía está resolviendo sus cursos
                    // aprobados en segundo plano.
                    toast.showToast('Espera un momento a que carguen tus datos e inténtalo de nuevo', 'info');
                    return;
                }

                try {
                    // Verificar si ya está pendiente con este código
                    const tempStudentDoc = await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`).get();
                    if (tempStudentDoc.exists && tempStudentDoc.data().courseCode === joinCourseCode) {
                        toast.showToast('Ya tienes una solicitud pendiente para este curso', 'error');
                        return;
                    }

                    // Verificar que el código corresponda a un curso real. La consulta
                    // también puede devolver el doc del catálogo global (courses/{id} en
                    // la raíz, que guarda una copia de courseCode pero no tiene
                    // subcolección students) — se filtra para quedarnos solo con los
                    // cursos reales dentro de professors/{uid}/courses.
                    const matchingCoursesSnap = await db.collectionGroup('courses').where('courseCode', '==', joinCourseCode).get();
                    const matchingCourses = matchingCoursesSnap.docs.filter(d => d.ref.path.includes('/professors/'));
                    if (matchingCourses.length === 0) {
                        toast.showToast('Ese código de curso no existe. Verifica con tu profesor.', 'error');
                        return;
                    }

                    // Verificar si ya está aprobado en alguno de los cursos que coinciden
                    for (const courseDoc of matchingCourses) {
                        const studentDoc = await courseDoc.ref.collection('students').doc(currentUser.uid).get();
                        if (studentDoc.exists) {
                            toast.showToast('Ya estás registrado en este curso', 'error');
                            return;
                        }
                    }

                    await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`)
                        .set({
                            email: currentUser.email,
                            fullName: userData?.fullName || currentUser.email.split('@')[0],
                            userType: 'student',
                            courseCode: joinCourseCode,
                            badgesEarned: [],
                            lastBadgeEarned: null,
                            createdAt: new Date()
                        });

                    toast.showToast('Solicitud enviada. Espera la aprobación del profesor.', 'success');
                    setShowJoinCourse(false);
                    setJoinCourseCode('');
                    loadCourseData();
                } catch (error) {
                    console.error('Error uniéndose al curso:', error);
                    toast.showToast('Error enviando solicitud', 'error');
                }
            };

            const handleUpdateProfile = async (e) => {
                e.preventDefault();

                try {
                    if (profileData.newPassword) {
                        if (profileData.newPassword !== profileData.confirmPassword) {
                            toast.showToast('Las contraseñas no coinciden', 'error');
                            return;
                        }

                        const credential = firebase.auth.EmailAuthProvider.credential(
                            currentUser.email,
                            profileData.currentPassword
                        );
                        await currentUser.reauthenticateWithCredential(credential);
                        await currentUser.updatePassword(profileData.newPassword);
                        toast.showToast('Contraseña actualizada', 'success');
                    }

                    if (profileData.fullName && profileData.fullName !== userData?.fullName) {
                        const tempDoc = await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`).get();
                        if (tempDoc.exists) {
                            await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`)
                                .update({ fullName: profileData.fullName });
                        }

                        // Cada curso guarda su propia copia de fullName en el roster
                        // del profesor, así que hay que propagar el cambio a todos los
                        // cursos donde el estudiante ya está aprobado, no solo al primero.
                        await Promise.all(courses.map(course =>
                            db.doc(`artifacts/academic-platform/professors/${course.professorId}/courses/${course.id}/students/${currentUser.uid}`)
                                .update({ fullName: profileData.fullName })
                        ));

                        toast.showToast('Nombre actualizado', 'success');
                    }

                    setShowProfile(false);
                    setProfileData({ fullName: '', currentPassword: '', newPassword: '', confirmPassword: '' });
                    loadCourseData();
                } catch (error) {
                    if (error.code === 'auth/wrong-password') {
                        toast.showToast('Contraseña actual incorrecta', 'error');
                    } else {
                        toast.showToast('Error actualizando perfil', 'error');
                    }
                }
            };

            const startQRScanner = (forceShow = false) => {
                // Verificar si es la hora correcta
                if (!selectedCourse) {
                    toast.showToast('Por favor selecciona un curso primero', 'error');
                    return;
                }

                if (!selectedCourse.courseSchedule) {
                    toast.showToast('El curso no tiene horario configurado', 'error');
                    return;
                }

                const isCorrectTime = isCurrentClassTime(selectedCourse);

                if (!isCorrectTime && !forceShow) {
                    setShowQRTimeWarning(true);
                    return;
                }

                if (qrScannerStartInProgressRef.current) {
                    appendQRLog('Inicio ignorado: el escáner ya está arrancando.');
                    return;
                }
                qrScannerStartInProgressRef.current = true;
                setShowQRScanner(true);
                setQrZoomSupported(false);
                setQrZoomValue(1);
                setQrZoomMin(1);
                setQrZoomMax(1);
                setQrZoomStep(0.1);
                setQrNativeZoomMax(1);
                setQrScannerErrorDetail('');
                setQrScannerAttemptLogs([]);
                // NO hacer console.clear() aquí para mantener los logs de validación
                console.log('[QR-SCANNER] Iniciando diagnóstico de cámara...');
                pinchStartDistanceRef.current = null;
                pinchStartZoomRef.current = 1;
                scanHandledRef.current = false;

                setTimeout(async () => {
                    try {
                        if (scannerRef.current) {
                            appendQRLog('Liberando instancia anterior del escáner...');
                            try {
                                await scannerRef.current.stop();
                            } catch (stopError) {
                                appendQRLog(`Stop previo omitido: ${formatQRError(stopError)}`);
                            }
                            try {
                                await scannerRef.current.clear();
                            } catch (clearError) {
                                appendQRLog(`Clear previo omitido: ${formatQRError(clearError)}`);
                            }
                            scannerRef.current = null;
                        }

                        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                            throw new Error('Este navegador no soporta acceso a cámara (mediaDevices).');
                        }

                        if (!window.isSecureContext && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                            throw new Error('La cámara requiere HTTPS. En móvil usa https:// o localhost seguro.');
                        }

                        const scanConfig = {
                            fps: 15,
                            qrbox: { width: 280, height: 280 },
                            aspectRatio: 1
                        };

                        const cameraConstraintsFallback = [
                            {
                                facingMode: "environment",
                                width: { ideal: 1920 },
                                height: { ideal: 1080 },
                                advanced: [{ focusMode: "continuous" }]
                            },
                            {
                                facingMode: { ideal: "environment" },
                                width: { ideal: 1280 },
                                height: { ideal: 720 }
                            },
                            { facingMode: "environment" },
                            { facingMode: { ideal: "user" } }
                        ];

                        let startError = null;
                        let started = false;

                        for (let index = 0; index < cameraConstraintsFallback.length; index++) {
                            const cameraConfig = cameraConstraintsFallback[index];
                            const html5QrCode = new Html5Qrcode("qr-reader");
                            appendQRLog(`Intento ${index + 1}: ${JSON.stringify(cameraConfig)}`);

                            try {
                                await html5QrCode.start(
                                    cameraConfig,
                                    scanConfig,
                                    async (decodedText) => {
                                        try {
                                            const qrData = JSON.parse(decodedText);

                                            if (qrData.courseId && qrData.date && qrData.professorId) {
                                                // Marcar el escaneo como resuelto ANTES de tocar el
                                                // track de video: el setup de zoom que sigue corriendo
                                                // en paralelo (más abajo) puede fallar al leer
                                                // capacidades de un track que este stop() ya detuvo,
                                                // y eso no debe mostrarse como "Error de cámara".
                                                scanHandledRef.current = true;
                                                await registerAttendance(qrData);
                                                html5QrCode.stop().catch(() => {}).finally(() => {
                                                    setShowQRScanner(false);
                                                });
                                            } else {
                                                toast.showToast('QR inválido', 'error');
                                            }
                                        } catch (error) {
                                            console.error('Error procesando QR:', error);
                                        }
                                    }
                                );
                                started = true;
                                scannerRef.current = html5QrCode;
                                appendQRLog(`Intento ${index + 1}: cámara iniciada correctamente`);
                                break;
                            } catch (err) {
                                startError = err;
                                appendQRLog(`Intento ${index + 1}: ${formatQRError(err)}`);
                                try {
                                    await html5QrCode.clear();
                                } catch (clearError) {
                                    appendQRLog(`Intento ${index + 1}: clear omitido (${formatQRError(clearError)})`);
                                }
                            }
                        }

                        if (!started) {
                            throw startError || new Error('No se pudo iniciar la cámara');
                        }

                        const activeScanner = scannerRef.current;
                        setQrZoomSupported(true);
                        setQrZoomMin(1);
                        setQrZoomMax(20);
                        setQrZoomStep(0.5);
                        setQrZoomValue(1);

                        if (!scanHandledRef.current && activeScanner && typeof activeScanner.getRunningTrackCapabilities === 'function') {
                            const capabilities = activeScanner.getRunningTrackCapabilities();
                            if (capabilities && capabilities.zoom) {
                                const minZoom = typeof capabilities.zoom.min === 'number' ? capabilities.zoom.min : 1;
                                const maxZoom = typeof capabilities.zoom.max === 'number' ? capabilities.zoom.max : 1;
                                const stepZoom = typeof capabilities.zoom.step === 'number' && capabilities.zoom.step > 0 ? capabilities.zoom.step : 0.1;
                                const initialZoom = Math.max(minZoom, 1);

                                setQrNativeZoomMax(maxZoom);
                                setQrZoomStep(Math.max(0.5, stepZoom));
                                setQrZoomValue(initialZoom);
                                appendQRLog(`Zoom nativo soportado: min ${minZoom}, max ${maxZoom}, step ${stepZoom}. Zoom total habilitado hasta 20x (híbrido).`);

                                try {
                                    await activeScanner.applyVideoConstraints({
                                        advanced: [{ zoom: initialZoom }]
                                    });
                                    appendQRLog(`Zoom inicial aplicado: ${initialZoom.toFixed(1)}x`);
                                } catch (zoomError) {
                                    console.error('Zoom no soportado en este dispositivo:', zoomError);
                                    appendQRLog(`No se pudo aplicar zoom inicial: ${zoomError?.name || 'Error'} - ${zoomError?.message || 'Sin mensaje'}`);
                                }
                            } else {
                                setQrNativeZoomMax(1);
                                appendQRLog('Este dispositivo no expone zoom nativo. Se usa zoom digital hasta 20x.');
                            }
                        }
                    } catch (err) {
                        console.error('Error iniciando escáner:', err);
                        const fullError = formatQRError(err);
                        setQrScannerErrorDetail(fullError);
                        appendQRLog(`Fallo final: ${fullError}`);
                        if (!scanHandledRef.current) {
                            // Si ya se registró la asistencia con éxito, esta excepción
                            // es solo fallout de detener la cámara/leer capacidades de
                            // un track que el propio escaneo exitoso ya cerró — no es un
                            // error real que el usuario deba ver.
                            toast.showToast('Error de cámara', 'error');
                        }
                        scannerRef.current = null;
                        appendQRLog('El modal permanece abierto para revisar diagnóstico y reintentar.');
                    } finally {
                        qrScannerStartInProgressRef.current = false;
                    }
                }, 100);
            };

            const stopQRScanner = () => {
                qrScannerStartInProgressRef.current = false;
                if (scannerRef.current) {
                    scannerRef.current.stop().then(() => {
                        scannerRef.current = null;
                        const videoElement = document.querySelector('#qr-reader video');
                        if (videoElement) {
                            videoElement.style.transform = 'scale(1)';
                        }
                        setQrScannerErrorDetail('');
                        setQrScannerAttemptLogs([]);
                        pinchStartDistanceRef.current = null;
                        pinchStartZoomRef.current = 1;
                        setShowQRScanner(false);
                    }).catch(err => {
                        console.error('Error deteniendo escáner:', err);
                        scannerRef.current = null;
                        const videoElement = document.querySelector('#qr-reader video');
                        if (videoElement) {
                            videoElement.style.transform = 'scale(1)';
                        }
                        setQrScannerErrorDetail('');
                        setQrScannerAttemptLogs([]);
                        pinchStartDistanceRef.current = null;
                        pinchStartZoomRef.current = 1;
                        setShowQRScanner(false);
                    });
                } else {
                    setQrScannerErrorDetail('');
                    setQrScannerAttemptLogs([]);
                    pinchStartDistanceRef.current = null;
                    pinchStartZoomRef.current = 1;
                    setShowQRScanner(false);
                }
            };

            const registerAttendance = async (qrData) => {
                try {
                    // Verificar que el estudiante esté matriculado en el curso
                    const professorCoursesRef = db.collection(`artifacts/academic-platform/professors/${qrData.professorId}/courses/${qrData.courseId}/students`);
                    const studentDoc = await professorCoursesRef.doc(currentUser.uid).get();

                    if (!studentDoc.exists) {
                        toast.showToast('No estás matriculado en este curso', 'error');
                        return;
                    }

                    const attendanceRef = db.doc(`artifacts/academic-platform/courses/${qrData.courseId}/attendance/${qrData.date}`);
                    const attendanceDoc = await attendanceRef.get();

                    const studentData = {
                        studentId: currentUser.uid,
                        studentName: userData?.fullName || currentUser.email,
                        timestamp: new Date()
                    };

                    if (attendanceDoc.exists) {
                        const existingData = attendanceDoc.data();
                        const students = existingData.students || [];

                        if (students.some(s => s.studentId === currentUser.uid)) {
                            toast.showToast('Ya registraste tu asistencia hoy', 'info');
                            return;
                        }

                        await attendanceRef.update({
                            students: [...students, studentData]
                        });
                    } else {
                        await attendanceRef.set({
                            date: qrData.date,
                            courseId: qrData.courseId,
                            professorId: qrData.professorId,
                            students: [studentData]
                        });
                    }

                    toast.showToast('¡Asistencia registrada exitosamente!', 'success');
                } catch (error) {
                    console.error('Error registrando asistencia:', error);
                    toast.showToast('Error registrando asistencia', 'error');
                }
            };

            const getShiftForHour = (hour) => {
                if (hour >= 6 && hour < 12) return 'DIURNO';
                if (hour >= 12 && hour < 18) return 'TARDE';
                if (hour >= 18 && hour < 22) return 'NOCTURNO';
                return null;
            };

            const getDefaultCourseForNow = (coursesArray = []) => {
                if (coursesArray.length === 0) return null;

                const now = new Date();
                const dayOfWeek = now.getDay();
                const hour = now.getHours();
                const currentShift = getShiftForHour(hour);

                const dayKeys = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                const currentDayKey = dayKeys[dayOfWeek];

                // 1. Buscar curso de HOY con JORNADA ACTUAL
                if (currentShift) {
                    const todayMatchingShift = coursesArray.find((course) => {
                        const schedule = (course.courseSchedule || []);
                        return schedule.some((item) => item.dayKey === currentDayKey && item.shift === currentShift);
                    });
                    if (todayMatchingShift) return todayMatchingShift;
                }

                // 2. Buscar cualquier curso de HOY (sin importar jornada)
                const todayAny = coursesArray.find((course) => {
                    const schedule = (course.courseSchedule || []);
                    return schedule.some((item) => item.dayKey === currentDayKey);
                });
                if (todayAny) return todayAny;

                // 3. Buscar primer curso para jornada actual de cualquier día
                if (currentShift) {
                    const anyMatchingShift = coursesArray.find((course) => {
                        const schedule = (course.courseSchedule || []);
                        return schedule.some((item) => item.shift === currentShift);
                    });
                    if (anyMatchingShift) return anyMatchingShift;
                }

                // 4. Devolver el primer curso disponible
                return coursesArray[0];
            };

            const sortCoursesBySchedule = (coursesArray = []) => {
                const dayOrder = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
                const shiftOrder = { 'DIURNO': 0, 'TARDE': 1, 'NOCTURNO': 2 };

                return [...coursesArray].sort((a, b) => {
                    const scheduleA = a.courseSchedule || [];
                    const scheduleB = b.courseSchedule || [];

                    if (scheduleA.length === 0) return 1;
                    if (scheduleB.length === 0) return -1;

                    // Obtener el primer día de cada curso (el más temprano en la semana)
                    const firstDayA = scheduleA.reduce((min, item) => {
                        const dayIndex = dayOrder.indexOf(item.dayKey);
                        const minIndex = dayOrder.indexOf(min.dayKey);
                        return dayIndex < minIndex ? item : min;
                    });

                    const firstDayB = scheduleB.reduce((min, item) => {
                        const dayIndex = dayOrder.indexOf(item.dayKey);
                        const minIndex = dayOrder.indexOf(min.dayKey);
                        return dayIndex < minIndex ? item : min;
                    });

                    // Comparar por día primero
                    const dayIndexA = dayOrder.indexOf(firstDayA.dayKey);
                    const dayIndexB = dayOrder.indexOf(firstDayB.dayKey);

                    if (dayIndexA !== dayIndexB) {
                        return dayIndexA - dayIndexB;
                    }

                    // Si es el mismo día, comparar por jornada
                    const shiftIndexA = shiftOrder[firstDayA.shift] || 3;
                    const shiftIndexB = shiftOrder[firstDayB.shift] || 3;
                    return shiftIndexA - shiftIndexB;
                });
            };

            const isCurrentClassTime = (course) => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const hour = now.getHours();

                if (!course) {
                    return false;
                }

                if (!course.courseSchedule || course.courseSchedule.length === 0) {
                    return false;
                }

                const dayKeys = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                const currentDayKey = dayKeys[dayOfWeek];
                const currentShift = getShiftForHour(hour);

                // Si no hay jornada activa, NO permitir QR
                if (!currentShift) {
                    return false;
                }

                // Verificar si el curso está programado para hoy
                const todaySchedule = course.courseSchedule.find((item) => item.dayKey === currentDayKey);

                if (!todaySchedule) {
                    return false;
                }

                // Verificar si la jornada actual coincide
                if (todaySchedule.shift === currentShift) {
                    return true;
                }

                return false;
            };

            React.useEffect(() => {
                loadUserData();
                loadCourseData();
            }, []);

            React.useEffect(() => {
                if (selectedCourse) {
                    loadCourseContent(selectedCourse);
                }
            }, [selectedCourse]);

            const loadUserData = async () => {
                // Los datos del usuario se cargarán junto con los datos del curso
                setLoading(false);
            };

            const loadCourseData = async () => {
                try {
                    // Primero verificar si está en temp-students
                    const tempStudentDoc = await db.doc(`artifacts/academic-platform/temp-students/${currentUser.uid}`).get();

                    if (tempStudentDoc.exists) {
                        // Estudiante pendiente de aprobación
                        const tempData = tempStudentDoc.data();
                        setUserData({ ...tempData, isPending: true });
                        setProfessorName('Pendiente de aprobación');
                        return;
                    }

                    // collectionGroup en vez de enumerar professors: ese patrón se
                    // salta cualquier professors/{uid} "fantasma" (el caso normal,
                    // ya que el perfil real vive en profile/data) y dejaba al
                    // estudiante en "Cargando..." para siempre si su profesor no
                    // tenía datos propios en el doc raíz.
                    const myEnrollments = await db.collectionGroup('students')
                        .where('studentId', '==', currentUser.uid)
                        .get();

                    const studentCourses = [];
                    for (const studentDoc of myEnrollments.docs) {
                        const courseRef = studentDoc.ref.parent.parent;
                        const profRef = courseRef.parent.parent;
                        const courseSnap = await courseRef.get();
                        if (!courseSnap.exists) continue;

                        studentCourses.push({
                            id: courseRef.id,
                            professorId: profRef.id,
                            studentData: studentDoc.data(),
                            ...courseSnap.data()
                        });
                    }

                    if (studentCourses.length > 0) {
                        setCourses(studentCourses);

                        // Si no hay curso seleccionado, usar lógica inteligente
                        if (!selectedCourse) {
                            const defaultCourse = getDefaultCourseForNow(studentCourses);
                            setSelectedCourse(defaultCourse);
                        }

                        setUserData(studentCourses[0].studentData);
                    }

                } catch (error) {
                    console.error('Error cargando datos del curso:', error);
                    setProfessorName('Error cargando');
                } finally {
                    // Se marca listo en todos los caminos (incluido error) para
                    // no dejar bloqueado permanentemente el botón "Unirse a un curso".
                    courseDataReadyRef.current = true;
                }
            };

            const loadCourseContent = async (course) => {
                try {
                    if (!course) return;

                    setUserData(course.studentData);
                    setProfessorName(course.professorName || 'No asignado');
                    setCourseInfo(course);

                    // Crear contenido dinámico
                    const contentArray = [];

                    contentArray.push({
                        id: 'info',
                        type: 'info',
                        title: 'Información General del Curso',
                        description: 'Datos del curso y badges disponibles',
                        unlocked: true
                    });

                    for (let i = 1; i <= course.weeks; i++) {
                        const weekData = course.weeklyContent?.find(w => w.week === i);
                        const weekBadges = course.availableBadges?.filter(badge => badge.maxWeek === i) || [];
                        contentArray.push({
                            id: i,
                            week: i,
                            title: weekData?.title || `Semana ${i}`,
                            description: weekData?.description || 'Contenido por definir',
                            content: weekData?.content || '',
                            activities: weekData?.activities || [],
                            badges: weekBadges,
                            unlocked: i === 1
                        });
                    }

                    setDynamicContent(contentArray);
                } catch (error) {
                    console.error('Error cargando contenido del curso:', error);
                }
            };

            const handleLogout = async () => {
                try {
                    await auth.signOut();
                    toast.showToast('¡Hasta luego!', 'success');
                } catch (err) {
                    toast.showToast("Error al cerrar sesión. Intenta de nuevo.", 'error');
                }
            };

            const getBadgeStatus = (badgeId) => {
                if (!userData || !userData.badgesEarned) return false;
                return userData.badgesEarned.includes(badgeId);
            };

            const getBadgeStatusType = (badgeId) => {
                if (!userData || !userData.badgeStatus) return null;
                return userData.badgeStatus[badgeId] || null;
            };

            const getProgressPercentage = () => {
                if (!userData || !userData.badgesEarned) return 0;
                return Math.round((userData.badgesEarned.length / 20) * 100);
            };

            const isContentUnlocked = (content) => {
                if (content.unlocked) return true;
                // Cada semana se desbloquea si todas las semanas anteriores tienen todos sus badges ganados
                if (content.week && content.week > 1) {
                    for (let week = 1; week < content.week; week++) {
                        const weekBadges = dynamicContent.find(c => c.week === week)?.badges || [];
                        if (weekBadges.length === 0) continue; // Si no hay badges, continuar
                        const hasAllBadges = weekBadges.every((badge, index) => {
                            // Encontrar el índice global del badge en availableBadges
                            const globalIndex = courseInfo?.availableBadges?.findIndex(b => b.name === badge.name && b.maxWeek === week) ?? index;
                            const badgeId = `${week}-${globalIndex}`;
                            return getBadgeStatus(badgeId);
                        });
                        if (!hasAllBadges) {
                            return false; // Si no tiene todos los badges de alguna semana anterior, bloquear
                        }
                    }
                    return true;
                }
                return true;
            };

            if (loading) {
                return <LoadingSpinner />;
            }

            if (userData?.isPending) {
                return (
                    <div className="min-h-screen p-4 md:p-8" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <div className="max-w-2xl mx-auto">
                            <div className="card rounded-xl p-8 text-center">
                                <div className="mb-6">
                                    <div className="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <span className="text-3xl">⏳</span>
                                    </div>
                                    <h1 className="text-2xl font-bold mb-2">Registro Pendiente</h1>
                                    <p className="text-lg" style={{ color: 'var(--text-secondary)' }}>
                                        Hola, <strong>{userData.fullName}</strong>
                                    </p>
                                </div>

                                <div className="bg-orange-50 border border-orange-200 rounded-lg p-6 mb-6">
                                    <h2 className="font-semibold text-orange-800 mb-2">Tu registro está siendo revisado</h2>
                                    <p className="text-orange-700 mb-4">
                                        Te has registrado exitosamente con el código <strong>{userData.courseCode}</strong>.
                                        El profesor debe aprobar tu solicitud antes de que puedas acceder al contenido del curso.
                                    </p>
                                    <p className="text-sm text-orange-600">
                                        Recibirás acceso una vez que el profesor apruebe tu registro.
                                        Puedes cerrar esta página y volver más tarde.
                                    </p>
                                </div>

                                {editingPendingCode ? (
                                    <form onSubmit={handleFixPendingCode} className="text-left mb-6">
                                        <label className="block text-sm font-bold mb-2">
                                            Nuevo código de curso
                                        </label>
                                        <input
                                            className="input-field w-full py-3 px-4 rounded-lg focus:outline-none mb-3"
                                            type="text"
                                            placeholder="#codigo_del_profesor"
                                            value={pendingCodeInput}
                                            onChange={(e) => setPendingCodeInput(e.target.value)}
                                            autoFocus
                                        />
                                        <div className="flex gap-3">
                                            <button
                                                type="submit"
                                                className="btn btn-primary flex-1"
                                                disabled={fixingPendingCode}
                                            >
                                                {fixingPendingCode && <Loader2 className="w-5 h-5" />}
                                                Guardar código
                                            </button>
                                            <button
                                                type="button"
                                                className="btn btn-secondary"
                                                onClick={() => { setEditingPendingCode(false); setPendingCodeInput(''); }}
                                            >
                                                Cancelar
                                            </button>
                                        </div>
                                    </form>
                                ) : (
                                    <p className="text-sm mb-6" style={{ color: 'var(--text-secondary)' }}>
                                        ¿El profesor no encuentra tu solicitud? Puede que el código tenga un error.{' '}
                                        <button
                                            type="button"
                                            className="font-semibold underline"
                                            style={{ color: 'var(--accent-color)' }}
                                            onClick={() => { setEditingPendingCode(true); setPendingCodeInput(userData.courseCode || ''); }}
                                        >
                                            Corregir código de curso
                                        </button>
                                    </p>
                                )}

                                <div className="flex justify-center gap-3">
                                    <ThemeToggle />
                                    <button
                                        onClick={handleLogout}
                                        className="btn btn-secondary"
                                    >
                                        Cerrar Sesión
                                    </button>
                                </div>
                            </div>
                        </div>
                        <footer className="mt-8 text-center text-xs" style={{ color: 'var(--text-secondary)' }}>
                            Developed by<br />Leandro Flórez-Aristizábal, Ph.D
                        </footer>
                    </div>
                );
            }

            if (showExpedition) {
                return <ExpeditionPage currentUser={currentUser} role="student" courseId={selectedCourse.id} courseName={selectedCourse.name} onBack={() => setShowExpedition(false)} />;
            }

            return (
                <div className="min-h-screen p-4 md:p-8" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    <header className="card rounded-xl p-6 mb-8 animate-fadeIn">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div className="flex-1">
                                <h1 className="text-3xl font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                    {courseInfo?.name || 'Cargando...'}
                                </h1>

                                {courses.length > 1 && (
                                    <div className="mb-4 flex flex-wrap gap-2">
                                        {sortCoursesBySchedule(courses).map((course, index) => (
                                            <button
                                                key={course.id}
                                                onClick={() => setSelectedCourse(course)}
                                                className={`px-4 py-2 rounded-full text-sm font-semibold transition-all ${selectedCourse?.id === course.id
                                                    ? 'bg-blue-500 text-white'
                                                    : 'bg-gray-200 text-gray-800 hover:bg-gray-300'
                                                    }`}
                                            >
                                                {course.name}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                <div className="flex items-center gap-2 text-sm" style={{ color: 'var(--text-secondary)' }}>
                                    <User />
                                    <span>Hola, <strong>{userData?.fullName || currentUser.email.split('@')[0]}</strong></span>
                                </div>
                                <div className="mt-2">
                                    <div className="flex items-center gap-2 text-sm" style={{ color: 'var(--text-secondary)' }}>
                                        <span>Progreso: {getProgressPercentage()}% ({userData?.badgesEarned?.length || 0}/20 badges)</span>
                                    </div>
                                    <div className="w-full bg-gray-200 rounded-full h-2 mt-1">
                                        <div
                                            className="h-2 rounded-full transition-all duration-300"
                                            style={{
                                                width: `${getProgressPercentage()}%`,
                                                background: 'linear-gradient(90deg, #ef4444 0%, #f97316 25%, #eab308 50%, #22c55e 75%, #3b82f6 100%)'
                                            }}
                                        ></div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-wrap items-center gap-3">
                                <button
                                    onClick={() => setShowJoinCourse(true)}
                                    className="btn btn-secondary"
                                    title="Unirse a un curso"
                                >
                                    +
                                </button>
                                <button
                                    onClick={() => startQRScanner(false)}
                                    className="btn btn-secondary"
                                    title="Registrar asistencia"
                                >
                                    📷
                                </button>
                                {selectedCourse?.expeditionEnabled && (
                                    <button
                                        onClick={() => setShowExpedition(true)}
                                        className="btn btn-secondary"
                                        title="Expedición"
                                    >
                                        🧭
                                    </button>
                                )}
                                <button
                                    onClick={() => setShowProfile(true)}
                                    className="btn btn-secondary"
                                    title="Perfil de usuario"
                                >
                                    <User />
                                </button>
                                <button
                                    onClick={handleLogout}
                                    className="btn btn-secondary"
                                    title="Cerrar sesión"
                                >
                                    Cerrar Sesión
                                </button>
                                <ThemeToggle />
                            </div>
                        </div>
                    </header>

                    {showQRTimeWarning && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="card rounded-xl p-6 w-full max-w-md">
                                <div className="flex items-start gap-3 mb-4">
                                    <div className="text-4xl">🕐</div>
                                    <div>
                                        <h3 className="text-lg font-bold">No es la hora de clase</h3>
                                        <p className="text-sm mt-1" style={{ color: 'var(--text-secondary)' }}>
                                            Estás intentando escanear en un horario distinto al programado.
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-red-50 border border-red-200 rounded-lg p-3 mb-4">
                                    <p className="text-sm font-semibold text-red-900 mb-2">⏰ Hora actual:</p>
                                    <p className="text-lg font-bold text-red-700">{new Date().toLocaleTimeString()}</p>
                                </div>

                                {selectedCourse?.courseSchedule && (
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">
                                        <p className="text-sm font-semibold text-blue-900 mb-2">📅 Horario de tu clase:</p>
                                        <div className="text-sm text-blue-800 space-y-1">
                                            {selectedCourse.courseSchedule.map((item, idx) => (
                                                <div key={idx} className="flex justify-between items-center">
                                                    <span className="font-medium">{item.dayName}</span>
                                                    <span className="bg-blue-200 text-blue-900 px-2 py-1 rounded text-xs font-bold">{item.shift}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <p className="text-sm text-gray-600 mb-4">
                                    🔓 Puedes escanear igualmente si lo necesitas, pero recuerda que puede indicar asistencia en la hora incorrecta.
                                </p>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowQRTimeWarning(false)}
                                        className="btn btn-secondary flex-1"
                                    >
                                        Cancelar
                                    </button>
                                    <button
                                        onClick={() => {
                                            setShowQRTimeWarning(false);
                                            startQRScanner(true);
                                        }}
                                        className="btn btn-primary flex-1"
                                    >
                                        Escanear
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showQRScanner && (
                        <div className="fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50 p-4">
                            <div className="card rounded-xl p-6 w-full max-w-md">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold">Escanear QR de Asistencia</h3>
                                    <button onClick={stopQRScanner} className="text-2xl">×</button>
                                </div>
                                <div
                                    id="qr-reader"
                                    className="w-full"
                                    style={{ touchAction: 'none' }}
                                    onTouchStart={handleQRPinchStart}
                                    onTouchMove={handleQRPinchMove}
                                    onTouchEnd={handleQRPinchEnd}
                                    onTouchCancel={handleQRPinchEnd}
                                ></div>
                                {qrZoomSupported && (
                                    <div className="mt-4">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-sm font-semibold">Zoom de cámara</span>
                                            <span className="text-sm" style={{ color: 'var(--text-secondary)' }}>{qrZoomValue.toFixed(1)}x</span>
                                        </div>
                                        <div className="flex items-center justify-center gap-2 mb-3">
                                            {[1, 3, 5]
                                                .filter((zoomPreset) => zoomPreset >= qrZoomMin && zoomPreset <= qrZoomMax)
                                                .map((zoomPreset) => (
                                                    <button
                                                        key={zoomPreset}
                                                        type="button"
                                                        className="btn btn-secondary"
                                                        style={{
                                                            minWidth: '56px',
                                                            opacity: Math.abs(qrZoomValue - zoomPreset) < Math.max(qrZoomStep, 0.1) / 2 ? 1 : 0.8
                                                        }}
                                                        onClick={() => handleQRZoomChange(zoomPreset)}
                                                    >
                                                        {zoomPreset}x
                                                    </button>
                                                ))}
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                className="btn btn-secondary"
                                                onClick={() => handleQRZoomChange(Math.max(qrZoomMin, qrZoomValue - qrZoomStep))}
                                            >
                                                -
                                            </button>
                                            <input
                                                type="range"
                                                min={qrZoomMin}
                                                max={qrZoomMax}
                                                step={qrZoomStep}
                                                value={qrZoomValue}
                                                onChange={(e) => handleQRZoomChange(e.target.value)}
                                                className="w-full"
                                            />
                                            <button
                                                type="button"
                                                className="btn btn-secondary"
                                                onClick={() => handleQRZoomChange(Math.min(qrZoomMax, qrZoomValue + qrZoomStep))}
                                            >
                                                +
                                            </button>
                                        </div>
                                    </div>
                                )}
                                <p className="text-sm text-center mt-4" style={{ color: 'var(--text-secondary)' }}>
                                    Apunta la cámara al código QR del profesor. Usa este control para acercar la cámara sin hacer zoom del navegador.
                                </p>
                            </div>
                        </div>
                    )}

                    {showJoinCourse && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="card rounded-xl p-6 w-full max-w-md">
                                <h3 className="text-lg font-bold mb-4">Unirse a un Curso</h3>
                                <form onSubmit={handleJoinCourse}>
                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2">Código del Curso</label>
                                        <input
                                            className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                            type="text"
                                            placeholder="#codigo_del_profesor"
                                            value={joinCourseCode}
                                            onChange={(e) => {
                                                let value = e.target.value;
                                                if (value && !value.startsWith('#')) {
                                                    value = '#' + value;
                                                }
                                                setJoinCourseCode(value);
                                            }}
                                            required
                                        />
                                    </div>
                                    <div className="flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setShowJoinCourse(false);
                                                setJoinCourseCode('');
                                            }}
                                            className="btn btn-secondary flex-1"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-primary flex-1"
                                        >
                                            Enviar Solicitud
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showProfile && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="card rounded-xl p-6 w-full max-w-md">
                                <h3 className="text-lg font-bold mb-4">Perfil de Usuario</h3>
                                <form onSubmit={handleUpdateProfile}>
                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2">Nombre Completo</label>
                                        <input
                                            className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                            type="text"
                                            placeholder={userData?.fullName || 'Tu nombre completo'}
                                            value={profileData.fullName}
                                            onChange={(e) => setProfileData({ ...profileData, fullName: e.target.value })}
                                        />
                                    </div>

                                    <div className="border-t pt-4 mb-4">
                                        <h4 className="font-semibold mb-2">Cambiar Contraseña (Opcional)</h4>
                                        <div className="space-y-3">
                                            <div>
                                                <label className="block text-sm font-bold mb-2">Contraseña Actual</label>
                                                <div className="relative">
                                                    <input
                                                        className="input-field w-full py-2 px-3 pr-10 rounded-lg focus:outline-none"
                                                        type={showStudentCurrentPassword ? 'text' : 'password'}
                                                        placeholder="Contraseña actual"
                                                        value={profileData.currentPassword}
                                                        onChange={(e) => setProfileData({ ...profileData, currentPassword: e.target.value })}
                                                    />
                                                    <button
                                                        type="button"
                                                        className="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                                        onClick={() => setShowStudentCurrentPassword(!showStudentCurrentPassword)}
                                                    >
                                                        {showStudentCurrentPassword ? '🙉' : '🙈'}
                                                    </button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold mb-2">Nueva Contraseña</label>
                                                <div className="relative">
                                                    <input
                                                        className="input-field w-full py-2 px-3 pr-10 rounded-lg focus:outline-none"
                                                        type={showStudentNewPassword ? 'text' : 'password'}
                                                        placeholder="Nueva contraseña"
                                                        value={profileData.newPassword}
                                                        onChange={(e) => setProfileData({ ...profileData, newPassword: e.target.value })}
                                                    />
                                                    <button
                                                        type="button"
                                                        className="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                                                        onClick={() => setShowStudentNewPassword(!showStudentNewPassword)}
                                                    >
                                                        {showStudentNewPassword ? '🙉' : '🙈'}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <button
                                            type="button"
                                            onClick={() => {
                                                setShowProfile(false);
                                                setProfileData({ fullName: '', currentPassword: '', newPassword: '', confirmPassword: '' });
                                            }}
                                            className="btn btn-secondary flex-1"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="btn btn-primary flex-1"
                                        >
                                            Guardar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <main className="container mx-auto max-w-6xl">
                        <div className="grid gap-6">
                            {dynamicContent.map((content) => {
                                const unlocked = isContentUnlocked(content);
                                const isExpanded = expandedWeek === content.id;

                                return (
                                    <div key={content.id} className={`card rounded-xl overflow-hidden ${!unlocked ? 'opacity-50' : ''
                                        } ${content.type === 'info' ? 'bg-slate-100' : ''}`} style={content.type === 'info' ? { borderColor: 'var(--accent-color)' } : {}}>
                                        <div
                                            className={`p-6 transition-colors ${unlocked ? 'cursor-pointer' : 'cursor-not-allowed'
                                                }`}
                                            onClick={() => unlocked && setExpandedWeek(isExpanded ? null : content.id)}
                                        >
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-12 h-12 min-w-12 rounded-full flex items-center justify-center text-white font-bold ${unlocked ? 'bg-blue-500' : 'bg-gray-400'
                                                        }`}>
                                                        {unlocked ? (content.type === 'info' ? '📚' : (content.week || (content.weeks === '2-5' ? '2' : content.weeks))) : '🔒'}
                                                    </div>
                                                    <div>
                                                        <h3 className="text-lg font-semibold">
                                                            {content.type === 'info' ? content.title : (content.week ? `Semana ${content.week}: ${content.title}` : `Semanas ${content.weeks}: ${content.title}`)}
                                                        </h3>
                                                        <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>
                                                            {content.description}
                                                        </p>
                                                        {!unlocked && (
                                                            <span className="inline-block mt-1 px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded-full">
                                                                Bloqueado - Completa badge anterior
                                                            </span>
                                                        )}
                                                        {unlocked && content.badges && content.badges.length > 0 && (
                                                            <div className="mt-2 flex flex-wrap gap-1">
                                                                {content.badges.map((badge, index) => {
