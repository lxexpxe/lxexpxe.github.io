<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Académica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f9fafb;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --accent-color: #4D96FF;
            --success-color: #10b981;
            --error-color: #ef4444;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-primary: #111827;
            --bg-secondary: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-color: #374151;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .spinner {
            border: 4px solid rgba(77, 150, 255, 0.2);
            border-left-color: var(--accent-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                max-height: 0;
            }

            to {
                opacity: 1;
                max-height: 1000px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slideDown {
            animation: slideDown 0.3s ease-out;
        }

        .animate-fadeIn {
            animation: fadeIn 0.5s ease-out;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .input-field {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #3b82f6);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .btn-secondary {
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .theme-toggle {
            background-color: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
        }

        .toast {
            position: fixed;
            top: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            color: white;
            font-weight: 600;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .toast-success {
            background-color: var(--success-color);
        }

        .toast-error {
            background-color: var(--error-color);
        }

        .toast-info {
            background-color: var(--accent-color);
        }

        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #3b82f6);
            color: white;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .fab:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(77, 150, 255, 0.4);
        }

        #qr-reader {
            border-radius: 0.75rem;
            overflow: hidden;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const ToastContext = React.createContext();

        function ToastProvider({ children }) {
            const [toasts, setToasts] = React.useState([]);

            const showToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(toast => toast.id !== id));
                }, 3000);
            };

            return React.createElement(ToastContext.Provider, { value: { showToast } }, [
                children,
                React.createElement('div', { key: 'toasts' },
                    toasts.map(toast =>
                        React.createElement('div', {
                            key: toast.id,
                            className: `toast toast-${toast.type}`
                        }, toast.message)
                    )
                )
            ]);
        }

        const useToast = () => React.useContext(ToastContext);

        function useTheme() {
            const [theme, setTheme] = React.useState(() =>
                localStorage.getItem('theme') || 'light'
            );

            React.useEffect(() => {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            return { theme, toggleTheme };
        }

        function ThemeToggle() {
            const { theme, toggleTheme } = useTheme();
            return React.createElement('button', {
                className: 'theme-toggle',
                onClick: toggleTheme,
                title: `Cambiar a tema ${theme === 'light' ? 'oscuro' : 'claro'}`
            }, theme === 'light' ? '🌙' : '☀️');
        }

        const User = ({ className = '' }) => React.createElement('span', { className }, '👤');
        const LogOut = ({ className = '' }) => React.createElement('span', { className }, '⏻');
        const Loader2 = ({ className = '' }) => React.createElement('div', { className: `spinner ${className}` });

        const LoadingSpinner = () => (
            <div className="flex justify-center items-center py-8 animate-fadeIn">
                <div className="spinner"></div>
                <p className="ml-3" style={{ color: 'var(--text-secondary)' }}>Cargando...</p>
            </div>
        );

        function AuthPage() {
            const toast = useToast();
            const auth = firebase.auth();
            const db = firebase.firestore();
            const [isLogin, setIsLogin] = React.useState(true);
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [fullName, setFullName] = React.useState('');
            const [loading, setLoading] = React.useState(false);
            const [showCodeVerification, setShowCodeVerification] = React.useState(false);
            const [verificationCode, setVerificationCode] = React.useState('');
            const [generatedCode, setGeneratedCode] = React.useState('');
            const [pendingUserData, setPendingUserData] = React.useState(null);
            const [userRole, setUserRole] = React.useState('student');
            const [courseCode, setCourseCode] = React.useState('');
            const [showPasswordReset, setShowPasswordReset] = React.useState(false);
            const [newPassword, setNewPassword] = React.useState('');
            const [showPassword, setShowPassword] = React.useState(false);

            const validateEmail = (email) => {
                const validDomains = /^[a-zA-Z0-9._%+-]+@(icesi\.edu\.co|u\.icesi\.edu\.co|estudiante\.uniajc\.edu\.co|profesores\.uniajc\.edu\.co)$/;
                return validDomains.test(email);
            };

            const generateCode = () => Math.floor(100000 + Math.random() * 900000).toString();

            const courseCodeExists = async (code) => {
                // collectionGroup en vez de recorrer professors -> courses: la
                // mayoría de los docs professors/{uid} son "fantasma" (solo
                // contenedor, sin datos propios) y una consulta normal de
                // colección los salta por completo, dejando invisibles los
                // cursos de esos profesores.
                const snap = await db.collectionGroup('courses').where('courseCode', '==', code).get();
                return !snap.empty;
            };

            const sendVerificationEmail = async (email, code, fullName) => {
                try {
                    emailjs.init('145MnHTSSDkBVKZAU');

                    const templateParams = {
                        to_name: fullName || email.split('@')[0],
                        to_email: email,
                        verification_code: code,
                        from_name: 'Plataforma Académica'
                    };

                    const result = await emailjs.send(
                        'service_7u1zcni',
                        'template_1129sv3',
                        templateParams
                    );

                    toast.showToast('Código enviado a tu correo', 'success');
                } catch (error) {
                    console.error('Error enviando email:', error);
                    console.log(`Código de verificación para ${email}: ${code}`);
                    toast.showToast(`Error enviando email. Código (desarrollo): ${code}`, 'info');
                }
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                setLoading(true);

                if (!validateEmail(email)) {
                    toast.showToast('Usa tu correo institucional (@icesi.edu.co, @u.icesi.edu.co, @estudiante.uniajc.edu.co o @profesores.uniajc.edu.co)', 'error');
                    setLoading(false);
                    return;
                }

                try {
                    if (isLogin) {
                        const result = await auth.signInWithEmailAndPassword(email, password);
                        toast.showToast('¡Bienvenido de vuelta!', 'success');
                    } else {
                        const code = generateCode();
                        setGeneratedCode(code);

                        if (userRole === 'student') {
                            if (!courseCode.startsWith('#')) {
                                toast.showToast('Los estudiantes deben ingresar un código de curso válido (#codigo)', 'error');
                                setLoading(false);
                                return;
                            }
                        }

                        const pendingData = {
                            email,
                            password,
                            fullName,
                            userType: userRole
                        };

                        if (userRole === 'student') {
                            pendingData.courseCode = courseCode;
                        }

                        setPendingUserData(pendingData);

                        await sendVerificationEmail(email, code, fullName);
                        setShowCodeVerification(true);
                    }
                } catch (err) {
                    console.error('Error en handleAuth:', err);
                    let errorMessage = 'Error de autenticación. Por favor, intenta de nuevo.';

                    if (err.code === 'auth/invalid-email') {
                        errorMessage = 'El correo electrónico no tiene un formato válido.';
                    } else if (err.code === 'auth/user-not-found') {
                        errorMessage = 'Usuario no encontrado. Verifica tu correo o crea una cuenta.';
                    } else if (err.code === 'auth/wrong-password') {
                        errorMessage = 'Contraseña incorrecta.';
                    } else if (err.code === 'auth/email-already-in-use') {
                        errorMessage = 'Este correo ya está registrado.';
                    } else if (err.code === 'auth/weak-password') {
                        errorMessage = 'La contraseña es demasiado débil. Debe tener al menos 6 caracteres.';
                    }

                    toast.showToast(errorMessage, 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handlePasswordReset = async (e) => {
                e.preventDefault();
                setLoading(true);

                if (!validateEmail(email)) {
                    toast.showToast('Ingresa tu correo institucional', 'error');
                    setLoading(false);
                    return;
                }

                try {
                    const code = generateCode();
                    setGeneratedCode(code);

                    await sendVerificationEmail(email, code, email.split('@')[0]);
                    setShowCodeVerification(true);
                    toast.showToast('Código enviado para restablecer contraseña', 'success');
                } catch (error) {
                    console.error('Error enviando código:', error);
                    toast.showToast('Error enviando código', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleResetPassword = async (e) => {
                e.preventDefault();
                setLoading(true);

                if (verificationCode !== generatedCode) {
                    toast.showToast('Código incorrecto', 'error');
                    setLoading(false);
                    return;
                }

                try {
                    await auth.sendPasswordResetEmail(email);
                    toast.showToast('Se envió un enlace de restablecimiento a tu correo', 'success');
                    setShowPasswordReset(false);
                    setShowCodeVerification(false);
                } catch (error) {
                    toast.showToast('Error restableciendo contraseña', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const handleVerifyCode = async (e) => {
                e.preventDefault();
                setLoading(true);

                if (verificationCode !== generatedCode) {
                    toast.showToast('Código incorrecto', 'error');
                    setLoading(false);
                    return;
                }

                try {
                    const userCredential = await auth.createUserWithEmailAndPassword(
                        pendingUserData.email,
                        pendingUserData.password
                    );
                    const user = userCredential.user;

                    if (pendingUserData.userType === 'student') {
                        const validCode = await courseCodeExists(pendingUserData.courseCode);
                        if (!validCode) {
                            await user.delete();
                            throw new Error('Curso no encontrado');
                        }
                    }

                    const userData = {
                        email: pendingUserData.email,
                        fullName: pendingUserData.fullName,
                        userType: pendingUserData.userType,
                        emailVerified: true,
                        createdAt: new Date()
                    };

                    if (pendingUserData.userType === 'professor') {
                        // Crear profesor con estructura profile
                        await db.doc(`artifacts/academic-platform/professors/${user.uid}/profile/data`)
                            .set(userData);
                    } else {
                        // Para estudiantes, solo guardamos los datos básicos
                        // El profesor los agregará manualmente a su curso
                        userData.badgesEarned = [];
                        userData.lastBadgeEarned = null;
                        userData.courseCode = pendingUserData.courseCode;

                        // Crear documento temporal del estudiante
                        await db.doc(`artifacts/academic-platform/temp-students/${user.uid}`)
                            .set(userData);
                    }

                    toast.showToast('¡Cuenta creada exitosamente! Bienvenido.', 'success');

                    setShowCodeVerification(false);
                    setVerificationCode('');
                    setGeneratedCode('');
                    setPendingUserData(null);
                } catch (err) {
                    console.error('Error creando cuenta:', err);
                    let errorMessage = 'Error creando la cuenta';

                    if (err.code === 'auth/email-already-in-use') {
                        errorMessage = 'Este correo ya está registrado';
                    } else if (err.code === 'permission-denied') {
                        errorMessage = 'Error de permisos en Firestore. Verifica las reglas de seguridad.';
                    } else if (err.message === 'Curso no encontrado') {
                        errorMessage = 'El código de curso no existe. Verifica con tu profesor y llena el formulario de nuevo.';
                        // Volver al formulario con los datos ya escritos (excepto la
                        // contraseña) para que solo tenga que corregir el código.
                        setShowCodeVerification(false);
                        setVerificationCode('');
                        setGeneratedCode('');
                        setPendingUserData(null);
                    }

                    toast.showToast(errorMessage, 'error');
                } finally {
                    setLoading(false);
                }
            };

            if (showPasswordReset && !showCodeVerification) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <div className="card rounded-2xl p-8 w-full max-w-md animate-fadeIn">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-3xl font-bold" style={{ color: 'var(--text-primary)' }}>
                                    Restablecer Contraseña
                                </h2>
                                <ThemeToggle />
                            </div>

                            <form onSubmit={handlePasswordReset}>
                                <div className="mb-4">
                                    <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                        Correo Institucional
                                    </label>
                                    <input
                                        className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                        type="email"
                                        placeholder="Correo institucional"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                        required
                                    />
                                </div>

                                <div className="flex flex-col gap-4">
                                    <button
                                        className="btn btn-primary w-full"
                                        type="submit"
                                        disabled={loading}
                                    >
                                        {loading && <Loader2 className="w-5 h-5" />}
                                        Enviar Código
                                    </button>

                                    <button
                                        className="btn btn-secondary w-full"
                                        type="button"
                                        onClick={() => {
                                            setShowPasswordReset(false);
                                            setEmail('');
                                        }}
                                    >
                                        Volver
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            if (showCodeVerification) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
                        <div className="card rounded-2xl p-8 w-full max-w-md animate-fadeIn">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-3xl font-bold" style={{ color: 'var(--text-primary)' }}>
                                    Verificar Código
                                </h2>
                                <ThemeToggle />
                            </div>

                            <div className="text-center mb-6">
                                <p className="text-sm" style={{ color: 'var(--text-secondary)' }}>
                                    Ingresa el código de 6 dígitos enviado a <strong>{pendingUserData?.email || email}</strong>
                                </p>
                            </div>

                            <form onSubmit={handleVerifyCode}>
                                <div className="mb-6">
                                    <input
                                        className="input-field w-full py-3 px-4 rounded-lg focus:outline-none text-center text-2xl tracking-widest"
                                        type="text"
                                        placeholder="000000"
                                        value={verificationCode}
                                        onChange={(e) => setVerificationCode(e.target.value.replace(/\D/g, '').slice(0, 6))}
                                        maxLength="6"
                                        required
                                    />
                                </div>

                                <div className="flex flex-col gap-4">
                                    <button
                                        className="btn btn-primary w-full"
                                        type="submit"
                                        disabled={loading || verificationCode.length !== 6}
                                        onClick={showPasswordReset ? handleResetPassword : handleVerifyCode}
                                    >
                                        {loading && <Loader2 className="w-5 h-5" />}
                                        {showPasswordReset ? 'Restablecer Contraseña' : 'Verificar y Crear Cuenta'}
                                    </button>

                                    <button
                                        className="btn btn-secondary w-full"
                                        type="button"
                                        onClick={() => {
                                            setShowCodeVerification(false);
                                            setVerificationCode('');
                                            setGeneratedCode('');
                                            setPendingUserData(null);
                                            setShowPasswordReset(false);
                                        }}
                                    >
                                        Volver
                                    </button>
                                </div>
                            </form>
                            <div className="text-center mt-4 text-xs" style={{ color: 'var(--text-secondary)' }}>
                                Developed by<br />Leandro Flórez-Aristizábal, Ph.D
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex items-center justify-center p-4" style={{ backgroundColor: 'var(--bg-primary)' }}>
                    <div className="card rounded-2xl p-8 w-full max-w-md animate-fadeIn">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold" style={{ color: 'var(--text-primary)' }}>
                                {isLogin ? 'Iniciar Sesión' : 'Crear Cuenta'}
                            </h2>
                            <ThemeToggle />
                        </div>

                        <form onSubmit={handleAuth}>
                            <div className="mb-4">
                                <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                    Correo Institucional
                                </label>
                                <input
                                    className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                    type="email"
                                    placeholder="Correo institucional"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                />
                            </div>

                            {!isLogin && (
                                <>
                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                            Nombre Completo
                                        </label>
                                        <input
                                            className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                            type="text"
                                            placeholder="Tu Nombre Completo"
                                            value={fullName}
                                            onChange={(e) => setFullName(e.target.value)}
                                            required
                                        />
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                            Tipo de Usuario
                                        </label>
                                        <select
                                            className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                            value={userRole}
                                            onChange={(e) => setUserRole(e.target.value)}
                                            required
                                        >
                                            <option value="student">Estudiante</option>
                                            <option value="professor">Profesor</option>
                                        </select>
                                    </div>

                                    {userRole === 'student' && (
                                        <div className="mb-4">
                                            <label className="block text-sm font-bold mb-2" style={{ color: 'var(--text-primary)' }}>
                                                Código de Curso
                                            </label>
                                            <input
                                                className="input-field w-full py-3 px-4 rounded-lg focus:outline-none"
                                                type="text"
                                                placeholder="#codigo_del_profesor"
                                                value={courseCode}
                                                onChange={(e) => {
                                                    let value = e.target.value;
                                                    if (value && !value.startsWith('#')) {
                                                        value = '#' + value;

                        <div className="text-center mt-4 text-xs" style={{ color: 'var(--text-secondary)' }}>

                        </div>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ currentUser }) {
            const auth = firebase.auth();
            const db = firebase.firestore();
            const toast = useToast();
            const [courses, setCourses] = React.useState([]);
            const [selectedCourse, setSelectedCourse] = React.useState(null);
            const [students, setStudents] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [userData, setUserData] = React.useState(null);
            const [expandedStudent, setExpandedStudent] = React.useState(null);
            const [showCreateCourse, setShowCreateCourse] = React.useState(false);
            const [showEditContent, setShowEditContent] = React.useState(false);
            const [editingWeek, setEditingWeek] = React.useState(null);
            const [newCourse, setNewCourse] = React.useState({
                name: '',
                code: '',
                university: '',
                description: '',
                weeks: 16,
                weeklyContent: [],
                courseSchedule: []
            });
            const [showContentPreview, setShowContentPreview] = React.useState(false);
            const [previewContent, setPreviewContent] = React.useState(null);
            const [showRanking, setShowRanking] = React.useState(false);
            const [pendingStudents, setPendingStudents] = React.useState([]);
            const [showPendingStudents, setShowPendingStudents] = React.useState(false);
            const [showAttendance, setShowAttendance] = React.useState(false);
            const [showExpedition, setShowExpedition] = React.useState(false);
            const [qrTeacherVisible, setQrTeacherVisible] = React.useState(true);
            const [showQRTeacherWarning, setShowQRTeacherWarning] = React.useState(false);
            const [forceShowTeacherQR, setForceShowTeacherQR] = React.useState(false);
            const [attendanceData, setAttendanceData] = React.useState({});
            const [showNewSemesterConfirm, setShowNewSemesterConfirm] = React.useState(false);
            const [newSemesterPeriod, setNewSemesterPeriod] = React.useState('');
            const [newSemesterLoading, setNewSemesterLoading] = React.useState(false);
            const [creatingTodayRecord, setCreatingTodayRecord] = React.useState(false);
            const qrCodeRef = React.useRef(null);
            const [weekContent, setWeekContent] = React.useState({
                title: '',
                description: '',
                content: '',
                activities: [''],
                badges: [{ name: '', description: '' }]
            });

            const courseDayOptions = [
                { key: 'SUN', label: 'D', name: 'Domingo' },
                { key: 'MON', label: 'L', name: 'Lunes' },
                { key: 'TUE', label: 'M', name: 'Martes' },
                { key: 'WED', label: 'M', name: 'Miércoles' },
                { key: 'THU', label: 'J', name: 'Jueves' },
                { key: 'FRI', label: 'V', name: 'Viernes' },
                { key: 'SAT', label: 'S', name: 'Sábado' }
            ];
            const courseShiftOptions = ['DIURNO', 'TARDE', 'NOCTURNO'];

            const normalizeCourseSchedule = (schedule = []) => {
                return courseDayOptions
                    .map((dayOption) => schedule.find((item) => item.dayKey === dayOption.key))
                    .filter(Boolean)
                    .map((item) => ({
                        ...item,
                        shift: item.shift || 'DIURNO'
                    }));
            };

            const toggleScheduleDay = (currentSchedule = [], dayOption) => {
                const exists = currentSchedule.some((item) => item.dayKey === dayOption.key);

                if (exists) {
                    return normalizeCourseSchedule(currentSchedule.filter((item) => item.dayKey !== dayOption.key));
                }

                return normalizeCourseSchedule([
                    ...currentSchedule,
                    {
                        dayKey: dayOption.key,
                        dayLabel: dayOption.label,
                        dayName: dayOption.name,
                        shift: 'DIURNO'
                    }
                ]);
            };

            const updateScheduleShift = (currentSchedule = [], dayKey, shift) => {
                const updated = currentSchedule.map((item) => (
                    item.dayKey === dayKey ? { ...item, shift } : item
                ));
                return normalizeCourseSchedule(updated);
            };

            const getShiftForHour = (hour) => {
                if (hour >= 6 && hour < 12) return 'DIURNO';
                if (hour >= 12 && hour < 18) return 'TARDE';
                if (hour >= 18 && hour < 22) return 'NOCTURNO';
                return null;
            };

            const getDefaultCourseForNow = (coursesArray = []) => {
                if (coursesArray.length === 0) return null;

                const now = new Date();
                const dayOfWeek = now.getDay();
                const hour = now.getHours();
                const currentShift = getShiftForHour(hour);

                const dayKeys = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                const currentDayKey = dayKeys[dayOfWeek];

                // 1. Buscar curso de HOY con JORNADA ACTUAL
                if (currentShift) {
                    const todayMatchingShift = coursesArray.find((course) => {
                        const schedule = normalizeCourseSchedule(course.courseSchedule || []);
                        return schedule.some((item) => item.dayKey === currentDayKey && item.shift === currentShift);
                    });
                    if (todayMatchingShift) return todayMatchingShift;
                }

                // 2. Buscar cualquier curso de HOY (sin importar jornada)
                const todayAny = coursesArray.find((course) => {
                    const schedule = normalizeCourseSchedule(course.courseSchedule || []);
                    return schedule.some((item) => item.dayKey === currentDayKey);
                });
                if (todayAny) return todayAny;

                // 3. Buscar primer curso para jornada actual de cualquier día
                if (currentShift) {
                    const anyMatchingShift = coursesArray.find((course) => {
                        const schedule = normalizeCourseSchedule(course.courseSchedule || []);
                        return schedule.some((item) => item.shift === currentShift);
                    });
                    if (anyMatchingShift) return anyMatchingShift;
                }

                // 4. Devolver el primer curso disponible
                return coursesArray[0];
            };

            const sortCoursesBySchedule = (coursesArray = []) => {
                const dayOrder = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
                const shiftOrder = { 'DIURNO': 0, 'TARDE': 1, 'NOCTURNO': 2 };

                return [...coursesArray].sort((a, b) => {
                    const scheduleA = a.courseSchedule || [];
                    const scheduleB = b.courseSchedule || [];

                    if (scheduleA.length === 0) return 1;
                    if (scheduleB.length === 0) return -1;

                    // Obtener el primer día de cada curso (el más temprano en la semana)
                    const firstDayA = scheduleA.reduce((min, item) => {
                        const dayIndex = dayOrder.indexOf(item.dayKey);
                        const minIndex = dayOrder.indexOf(min.dayKey);
                        return dayIndex < minIndex ? item : min;
                    });

                    const firstDayB = scheduleB.reduce((min, item) => {
                        const dayIndex = dayOrder.indexOf(item.dayKey);
                        const minIndex = dayOrder.indexOf(min.dayKey);
                        return dayIndex < minIndex ? item : min;
                    });

                    // Comparar por día primero
                    const dayIndexA = dayOrder.indexOf(firstDayA.dayKey);
                    const dayIndexB = dayOrder.indexOf(firstDayB.dayKey);

                    if (dayIndexA !== dayIndexB) {
                        return dayIndexA - dayIndexB;
                    }

                    // Si es el mismo día, comparar por jornada
                    const shiftIndexA = shiftOrder[firstDayA.shift] || 3;
                    const shiftIndexB = shiftOrder[firstDayB.shift] || 3;
                    return shiftIndexA - shiftIndexB;
                });
            };

            const isCurrentClassTimeTeacher = (course) => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                const hour = now.getHours();

                console.log(`[TEACHER-QR-CHECK] Verificando hora: ${now.toLocaleTimeString()}`);
                console.log(`[TEACHER-QR-CHECK] Día: ${dayOfWeek}, Hora: ${hour}`);

                if (!course || !course.courseSchedule || course.courseSchedule.length === 0) {
                    console.log('[TEACHER-QR-CHECK] ERROR: course o courseSchedule vacío');
                    return false;
                }

                const dayKeys = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
                const currentDayKey = dayKeys[dayOfWeek];
                const currentShift = getShiftForHour(hour);

                console.log(`[TEACHER-QR-CHECK] Día: ${currentDayKey}, Jornada: ${currentShift}`);

                // Si no hay jornada activa, NO permitir QR
                if (!currentShift) {
                    console.log('[TEACHER-QR-CHECK] BLOQUEADO: Fuera de horario de clases');
                    return false;
                }

                // Verificar si el curso está programado para hoy
                const todaySchedule = course.courseSchedule.find((item) => item.dayKey === currentDayKey);

                if (!todaySchedule) {
                    console.log(`[TEACHER-QR-CHECK] Curso no programado para ${currentDayKey}`);
                    return false;
                }

                // Verificar si la jornada coincide
                if (todaySchedule.shift === currentShift) {
                    console.log('[TEACHER-QR-CHECK] ✓ PERMITIDO: Hora y jornada correctas');
                    return true;
                }

                console.log(`[TEACHER-QR-CHECK] BLOQUEADO: Jornada no coincide. Esperada: ${todaySchedule.shift}, Actual: ${currentShift}`);
                return false;
            };

            React.useEffect(() => {
                loadUserData();
                loadCourses();
            }, []);

            React.useEffect(() => {
                if (selectedCourse) {
                    loadStudents();
                    if (showAttendance) {
                        // Verificar si es la hora correcta para mostrar el QR
                        const isCorrectTime = isCurrentClassTimeTeacher(selectedCourse);
                        console.log('[TEACHER-QR] isCorrectTime:', isCorrectTime, 'forceShowTeacherQR:', forceShowTeacherQR);

                        if (isCorrectTime || forceShowTeacherQR) {
                            setQrTeacherVisible(true);
                            generateTodayQR();
                        } else {
                            setQrTeacherVisible(false);
                            setShowQRTeacherWarning(true);
                        }
                    }
                }
            }, [selectedCourse, showAttendance, forceShowTeacherQR]);

            // Listener en tiempo real (en vez de recargar manualmente después de
            // cada aprobar/rechazar): con varias aprobaciones seguidas, cada
            // recarga manual competía por ser la última en resolver, y la que
            // ganaba la carrera podía pisar el estado con una foto ya vieja,
            // dejando estudiantes ya aprobados marcados como pendientes hasta
            // recargar la página. onSnapshot siempre converge al estado real
            // del servidor sin importar el orden de resolución.
            React.useEffect(() => {
                if (!selectedCourse) {
                    setPendingStudents([]);
                    return;
                }

                const unsubscribe = db.collection('artifacts/academic-platform/temp-students')
                    .where('courseCode', '==', selectedCourse.courseCode)
                    .onSnapshot(
                        (snapshot) => {
                            setPendingStudents(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        },
                        (error) => {
                            console.error('Error escuchando estudiantes pendientes:', error);
                        }
                    );

                return () => unsubscribe();
            }, [selectedCourse?.courseCode]);

            // Listener en tiempo real de asistencia mientras la pantalla del QR
            // está abierta: antes había que salir a home y volver para ver un
            // escaneo nuevo, porque loadAttendanceData() solo leía una vez.
            React.useEffect(() => {
                if (!selectedCourse || !showAttendance) return;

                const unsubscribe = db.collection(`artifacts/academic-platform/courses/${selectedCourse.id}/attendance`)
                    .onSnapshot(
                        (snapshot) => {
                            const attendanceByDate = {};
                            snapshot.docs.forEach(doc => {
                                attendanceByDate[doc.id] = doc.data().students || [];
                            });
                            setAttendanceData(attendanceByDate);
                        },
                        (error) => {
                            console.error('Error escuchando asistencia:', error);
                        }
                    );

                return () => unsubscribe();
            }, [selectedCourse?.id, showAttendance]);

            const loadUserData = async () => {
                try {
                    const userDoc = await db.doc(`artifacts/academic-platform/professors/${currentUser.uid}/profile/data`).get();
                    if (userDoc.exists) {
                        setUserData(userDoc.data());
                    }
                } catch (error) {
                    console.error('Error cargando datos del usuario:', error);
                }
            };

            const loadCourses = async () => {
                try {
                    const coursesQuery = await db.collection(`artifacts/academic-platform/professors/${currentUser.uid}/courses`).get();

                    const coursesData = coursesQuery.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    setCourses(coursesData);
                    if (coursesData.length > 0 && !selectedCourse) {
                        const defaultCourse = getDefaultCourseForNow(coursesData);
                        setSelectedCourse(defaultCourse);
                    }
                } catch (error) {
                    console.error('Error cargando cursos:', error);
                    toast.showToast('Error cargando cursos', 'error');
                } finally {
                    setLoading(false);
                }
            };

            const loadStudents = async () => {
                if (!selectedCourse) return;

                try {
                    const studentsQuery = await db.collection(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${selectedCourse.id}/students`)
                        .get();

                    const studentsData = studentsQuery.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));

                    setStudents(studentsData);
                } catch (error) {
                    console.error('Error cargando estudiantes:', error);
                    toast.showToast('Error cargando estudiantes', 'error');
                }
            };

            const approveStudent = async (studentData) => {
                try {
                    const studentInfo = {
                        ...studentData,
                        studentId: studentData.id,
                        approvedAt: new Date(),
                        badgesEarned: [],
                        badgeStatus: {},
                        lastBadgeEarned: null
                    };

                    await db.doc(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${selectedCourse.id}/students/${studentData.id}`)
                        .set(studentInfo);

                    // Agregar a enrollments en la colección global
                    await db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/enrollments/${studentData.id}`)
                        .set({
                            studentId: studentData.id,
                            fullName: studentData.fullName,
                            email: studentData.email,
                            enrolledAt: new Date()
                        });

                    await db.doc(`artifacts/academic-platform/temp-students/${studentData.id}`).delete();

                    toast.showToast('Estudiante aprobado exitosamente', 'success');
                    loadStudents();
                } catch (error) {
                    console.error('Error aprobando estudiante:', error);
                    toast.showToast('Error aprobando estudiante', 'error');
                }
            };

            const rejectStudent = async (studentId) => {
                try {
                    await db.doc(`artifacts/academic-platform/temp-students/${studentId}`).delete();
                    toast.showToast('Estudiante rechazado', 'success');
                } catch (error) {
                    console.error('Error rechazando estudiante:', error);
                    toast.showToast('Error rechazando estudiante', 'error');
                }
            };

            const approveAllPending = async () => {
                if (pendingStudents.length === 0) return;
                if (!confirm(`¿Aprobar a los ${pendingStudents.length} estudiante(s) pendientes de este curso?`)) {
                    return;
                }

                const results = await Promise.allSettled(pendingStudents.map(async (studentData) => {
                    const studentInfo = {
                        ...studentData,
                        studentId: studentData.id,
                        approvedAt: new Date(),
                        badgesEarned: [],
                        badgeStatus: {},
                        lastBadgeEarned: null
                    };

                    await db.doc(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${selectedCourse.id}/students/${studentData.id}`)
                        .set(studentInfo);

                    await db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/enrollments/${studentData.id}`)
                        .set({
                            studentId: studentData.id,
                            fullName: studentData.fullName,
                            email: studentData.email,
                            enrolledAt: new Date()
                        });

                    await db.doc(`artifacts/academic-platform/temp-students/${studentData.id}`).delete();
                }));

                const failed = results.filter(r => r.status === 'rejected').length;
                const approved = results.length - failed;
                if (failed > 0) {
                    console.error('Fallos aprobando estudiantes:', results.filter(r => r.status === 'rejected'));
                    toast.showToast(`${approved} aprobado(s), ${failed} fallaron`, approved > 0 ? 'info' : 'error');
                } else {
                    toast.showToast(`${approved} estudiante(s) aprobado(s)`, 'success');
                }
                loadStudents();
            };

            const generateTodayQR = () => {
                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
                const qrData = JSON.stringify({
                    courseId: selectedCourse.id,
                    date: today,
                    professorId: currentUser.uid
                });

                setTimeout(() => {
                    if (qrCodeRef.current) {
                        qrCodeRef.current.innerHTML = '';
                        new QRCode(qrCodeRef.current, {
                            text: qrData,
                            width: 512,
                            height: 512,
                            colorDark: '#000000',
                            colorLight: '#ffffff'
                        });
                    }
                }, 100);
            };

            const chunkArray = (arr, size) => {
                const chunks = [];
                for (let i = 0; i < arr.length; i += size) {
                    chunks.push(arr.slice(i, i + size));
                }
                return chunks;
            };

            const startNewSemester = async () => {
                if (!selectedCourse) return;

                setNewSemesterLoading(true);
                try {
                    const attendanceCollection = db.collection(`artifacts/academic-platform/courses/${selectedCourse.id}/attendance`);
                    const attendanceSnapshot = await attendanceCollection.get();

                    if (!attendanceSnapshot.empty) {
                        // No se borra el historial: se archiva en otra colección
                        // (fuera de lo que lee loadAttendanceData) para que la
                        // tabla del semestre actual arranque vacía sin perder los
                        // registros de semestres anteriores.
                        // 200 docs por lote (400 operaciones: set + delete cada uno,
                        // bajo el límite de 500 operaciones por batch de Firestore).
                        for (const chunk of chunkArray(attendanceSnapshot.docs, 200)) {
                            const batch = db.batch();
                            chunk.forEach(doc => {
                                const archiveRef = db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/attendance-archive/${doc.id}`);
                                batch.set(archiveRef, { ...doc.data(), archivedPeriod: selectedCourse.period || null });
                                batch.delete(doc.ref);
                            });
                            await batch.commit();
                        }
                    }

                    const trimmedPeriod = newSemesterPeriod.trim();
                    if (trimmedPeriod) {
                        await db.doc(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${selectedCourse.id}`)
                            .update({ period: trimmedPeriod });
                        setSelectedCourse(prev => prev && prev.id === selectedCourse.id ? { ...prev, period: trimmedPeriod } : prev);
                    }

                    setAttendanceData({});
                    setShowNewSemesterConfirm(false);
                    setNewSemesterPeriod('');
                    toast.showToast('Nuevo semestre iniciado: la tabla de asistencia quedó en blanco', 'success');
                } catch (error) {
                    console.error('Error iniciando nuevo semestre:', error);
                    toast.showToast('Error iniciando nuevo semestre', 'error');
                } finally {
                    setNewSemesterLoading(false);
                }
            };

            const createTodayAttendanceRecord = async () => {
                if (!selectedCourse) return;

                const now = new Date();
                const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

                setCreatingTodayRecord(true);
                try {
                    const attendanceRef = db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/attendance/${today}`);
                    const existing = await attendanceRef.get();
                    if (existing.exists) {
                        toast.showToast('Ya existe un registro de asistencia para hoy', 'info');
                        return;
                    }

                    await attendanceRef.set({
                        date: today,
                        courseId: selectedCourse.id,
                        professorId: currentUser.uid,
                        students: []
                    });

                    toast.showToast('Registro de hoy creado en la tabla de asistencia', 'success');
                } catch (error) {
                    console.error('Error creando el registro de asistencia de hoy:', error);
                    toast.showToast('Error creando el registro de hoy', 'error');
                } finally {
                    setCreatingTodayRecord(false);
                }
            };

            const markManualAttendance = async (student, date) => {
                if (!selectedCourse) return;

                try {
                    const attendanceRef = db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/attendance/${date}`);
                    const attendanceDoc = await attendanceRef.get();

                    const attendanceRecord = {
                        studentId: student.id,
                        studentName: student.fullName || student.email || 'Estudiante',
                        timestamp: new Date(),
                        source: 'manual'
                    };

                    if (attendanceDoc.exists) {
                        const existingData = attendanceDoc.data();
                        const studentsForDate = existingData.students || [];
                        const alreadyMarked = studentsForDate.some(record => record.studentId === student.id);

                        if (alreadyMarked) {
                            toast.showToast('La asistencia ya estaba registrada', 'info');
                            return;
                        }

                        await attendanceRef.update({
                            students: [...studentsForDate, attendanceRecord]
                        });
                    } else {
                        await attendanceRef.set({
                            date,
                            courseId: selectedCourse.id,
                            professorId: currentUser.uid,
                            students: [attendanceRecord]
                        });
                    }

                    setAttendanceData(prev => {
                        const current = prev[date] || [];
                        return {
                            ...prev,
                            [date]: [...current, attendanceRecord]
                        };
                    });

                    toast.showToast(`Asistencia manual registrada para ${student.fullName || student.email}`, 'success');
                } catch (error) {
                    console.error('Error registrando asistencia manual:', error);
                    toast.showToast('Error registrando asistencia manual', 'error');
                }
            };

            const createCourse = async () => {
                if (!newCourse.name || !newCourse.code || !newCourse.university) {
                    toast.showToast('Nombre, código y universidad son requeridos', 'error');
                    return;
                }

                try {
                    const courseCode = newCourse.code.startsWith('#') ? newCourse.code : '#' + newCourse.code;

                    const courseData = {
                        name: newCourse.name,
                        courseCode: courseCode,
                        university: newCourse.university,
                        description: newCourse.description,
                        courseSchedule: normalizeCourseSchedule(newCourse.courseSchedule || []),
                        weeks: newCourse.weeks,
                        professorId: currentUser.uid,
                        professorEmail: currentUser.email,
                        professorName: userData?.fullName || currentUser.email,
                        createdAt: new Date(),
                        studentsCount: 0,
                        weeklyContent: [],
                        badges: []
                    };

                    return;

                const results = await Promise.allSettled(students.map(async (student) => {
                    await db.doc(`artifacts/academic-platform/professors/${currentUser.uid}/courses/${selectedCourse.id}/students/${student.id}`).delete();
                    await db.doc(`artifacts/academic-platform/courses/${selectedCourse.id}/enrollments/${student.id}`).delete();
                }));

                const failed = results.filter(r => r.status === 'rejected').length;
                const removed = results.length - failed;
                if (failed > 0) {
                    console.error('Fallos removiendo estudiantes:', results.filter(r => r.status === 'rejected'));
                    toast.showToast(`${removed} removido(s), ${failed} fallaron`, removed > 0 ? 'info' : 'error');
